  const ls = LESSONS.filter(l=>hit(l.title)||hit(l.place)||hit(l.code));

  view.innerHTML = (us.length?'<h3 class="note">單元</h3><ul class="list">'+us.map(unitRow).join('')+'</ul>':'')

function setTab(t, clear=true){
  tab = t;

  if(clear){ $('#q').value=''; }
  if(t==='units') renderUnits(); else if(t==='places') renderPlaces(); else renderGuide();
}

function start(){

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 400);
const HOME = { pos:new THREE.Vector3(2.5, 24, 44), target:new THREE.Vector3(2.5, 3, -1) };
/* 看關聯線用的視角：從較高處往下看，讓線和箭頭一目了然 */
const LINKVIEW = { pos:new THREE.Vector3(2.5, 50, 12), target:new THREE.Vector3(2.5, 0, 0) };
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, renderer.domElement);

const hemi = new THREE.HemisphereLight(0xffffff, 0x8aa095, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3e0, 1.6);
sun.position.set(-20, 40, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-34,right:34,top:34,bottom:-34,near:1,far:120});
scene.add(sun);

const PAL = {
  light:{ sky:0xCDE6F2, water:0xBFE3A4, deep:0xAED692, sun:1.45, hemi:1.35, lamp:0.0, hill:1 },
  dark: { sky:0x1F3558, water:0x4A6B4C, deep:0x3D5A40, sun:0.6, hemi:0.75, lamp:1.4, hill:0.55 },
};
const C = { grass:0xA8DC6E, grass2:0x92CF5A, soil:0xFFE6C0, rock:0xE4DCF3, wall:0xFFF6E0, tile:0x6F86A6,
  wood:0xA9744E, tea:0x4FA64A, indigo:0x5B8DEF, persimmon:0xFF8A3D, gold:0xFFC857, white:0xFFFFFF,
  pink:0xFF9CC2, sky:0x74C0FF, yellow:0xFFD24D, glass:0xC9ECFF };
/* 每座島自己的頂面顏色：粉紅、淺藍、鵝黃輪流，只有課文島（茶園）保留綠色 */
const ISC = 1.3; /* 島（連同島上的房子與道具）整體放大倍率 */
const ISLAND_ROT = { hub:0, u1:0, u2:0, u3:0, u4:0, u5:0, u6:0, u7:0 }; /* 六角形地塊全部同方向：邊與邊互相平行，排成蜂巢狀 */
const ISLAND_COL = { hub:0xFFE58F, u1:0xFFBFD6, u2:0xA6D9FF, u3:0xB9E88A, u4:0x9CC8FF, u5:0xFFD0B0, u6:0xFFDB6E, u7:0xFFB0CF };
const M = {};
const mat = (hex, o={}) => (M[hex+JSON.stringify(o)] ||= new THREE.MeshStandardMaterial({color:hex, flatShading:true, roughness:0.85, ...o}));

/* water */
const water = new THREE.Mesh(new THREE.CircleGeometry(120, 64), new THREE.MeshStandardMaterial({color:PAL.light.water, roughness:0.6, metalness:0.05}));
water.rotation.x = -Math.PI/2; water.receiveShadow = true; scene.add(water);
const ring = new THREE.Mesh(new THREE.RingGeometry(26, 120, 64), new THREE.MeshBasicMaterial({color:PAL.light.deep, transparent:true, opacity:0.35}));
ring.rotation.x = -Math.PI/2; ring.position.y = 0.01; scene.add(ring);

/* 關西風的卡通山林：外圈淡藍綠遠山，內圈翠綠近山，山上有圓樹和杉樹，天上有雲 */
const hills = [], treeSpots = [], hillSpots = [];
let bridgeFrame = null; /* 東安橋的座標軸，狗上橋用 */
const rnd = (seed => () => (seed = (seed*1664525 + 1013904223) >>> 0) / 4294967296)(20261024);
function hillMat(hex){ const m = new THREE.MeshStandardMaterial({color:hex, flatShading:true, roughness:0.95}); hills.push({m, base:new THREE.Color(hex)}); return m; }
const domeGeo = new THREE.SphereGeometry(1, 12, 7, 0, Math.PI*2, 0, Math.PI/2);
function hill(x, z, r, h, hex, withTrees){
  const mesh = new THREE.Mesh(domeGeo, hillMat(hex));
  mesh.scale.set(r, h, r*(0.85+rnd()*0.3)); mesh.rotation.y = rnd()*Math.PI; mesh.position.set(x, -0.2, z);
  scene.add(mesh);
  if(withTrees) hillSpots.push({x, z, r, zr:mesh.scale.z});
  if(!withTrees) return;
  const n = Math.round(r*0.9);
  for(let i=0;i<n;i++){
    const a = rnd()*Math.PI*2, d = Math.sqrt(rnd())*0.78;
    const tx = x + Math.cos(a)*d*r, tz = z + Math.sin(a)*d*r*0.9, ty = h*Math.sqrt(1-d*d) - 0.4;
    const s = 0.9 + rnd()*0.8, blossom = [0xFF9CC2,0xFFD24D,0x6FCB8E,0xFFB3D1][i%4];
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12*s,0.16*s,0.8*s,5), mat(C.wood)); trunk.position.set(tx, ty+0.3*s, tz); scene.add(trunk);
    const crown = (i%3===2)
      ? new THREE.Mesh(new THREE.ConeGeometry(0.75*s, 2.2*s, 7), hillMat(0x4FB07A))
      : new THREE.Mesh(new THREE.IcosahedronGeometry(0.95*s, 0), hillMat(blossom));
    crown.position.set(tx, ty + (i%3===2 ? 1.5*s : 1.25*s), tz); scene.add(crown);
  }
}
for(let i=0;i<16;i++){ const a = i/16*Math.PI*2 + rnd()*0.2, d = 78 + rnd()*10, r = 15 + rnd()*7;
  if(Math.sin(a) > 0.1) continue;
  hill(Math.cos(a)*d, Math.sin(a)*d, r, 15 + rnd()*10, [0xB4D3FA,0xC7C0F2,0xA9DCF5][i%3], false); }
for(let i=0;i<18;i++){ const a = i/18*Math.PI*2 + rnd()*0.15, d = 50 + rnd()*8, r = 8 + rnd()*4;
  if(Math.sin(a) > 0.0) continue;
  hill(Math.cos(a)*d, Math.sin(a)*d, r, 6 + rnd()*5, [0x8EDBA8,0xFFD97A,0xF8B6CE,0xA9DCF5][i%4], true); }
const cloudMat = new THREE.MeshBasicMaterial({color:0xFFFFFF, fog:false});
const cloudGroup = new THREE.Group(); scene.add(cloudGroup);
for(let i=0;i<7;i++){
  const c = new THREE.Group(), a = i/7*Math.PI*2, d = 30 + rnd()*30;
  for(let j=0;j<4;j++){ const b = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2 - Math.abs(j-1.5)*0.45, 1), cloudMat); b.position.set(j*2.2-3.3, (j%2)*0.5, 0); b.scale.y = 0.7; c.add(b); }
  c.position.set(Math.cos(a)*d, 24 + rnd()*10, Math.sin(a)*d); c.rotation.y = -a; cloudGroup.add(c);
}


/* 小河：從畫面前方的草地蜿蜒流過，河裡有大石頭、小魚、小蝦、小蟹 */
const riverCurve = new THREE.CatmullRomCurve3([[-70,18.5],[-52,16.5],[-36,20.5],[-20,17.5],[-4,21],[12,18],[28,21.5],[44,18],[60,21],[74,18]].map(([x,z])=>new THREE.Vector3(x,0.03,z)));
const riverMat = new THREE.MeshStandardMaterial({color:0x6EC6E8, roughness:0.35, metalness:0.05, flatShading:true});
function ribbon(curve, width, y, material, n=240){
  const pts = curve.getSpacedPoints(n), pos = [], idx = [];
  pts.forEach((p,i)=>{ const t = curve.getTangent(i/n); const nx = -t.z, nz = t.x; const l = Math.hypot(nx,nz)||1;
    pos.push(p.x+nx/l*width/2, y, p.z+nz/l*width/2, p.x-nx/l*width/2, y, p.z-nz/l*width/2);
    if(i<n){ const a=i*2; idx.push(a,a+2,a+1, a+1,a+2,a+3); } });
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, material); m.receiveShadow = true; scene.add(m); return m;
}
const bankMat = new THREE.MeshStandardMaterial({color:0xFFF0CC, roughness:0.95, flatShading:true});
ribbon(riverCurve, 9.4, 0.02, bankMat);
ribbon(riverCurve, 7.3, 0.05, riverMat);
const riverPoint = (t, off=0)=>{ const p = riverCurve.getPointAt(t), tg = riverCurve.getTangentAt(t); return p.clone().add(new THREE.Vector3(-tg.z,0,tg.x).multiplyScalar(off)); };
const critters = [], crabPickables = [];
const S = (g,x,y,z,sx=1,sy=1,sz=1,m)=>{ const me = new THREE.Mesh(g, m); me.position.set(x,y,z); me.scale.set(sx,sy,sz); me.castShadow = false; return me; };
const whiteM = new THREE.MeshStandardMaterial({color:0xFFFFFF, flatShading:true}), blackM = new THREE.MeshStandardMaterial({color:0x2B3A55, flatShading:true});
function makeFish(col){
  const f = new THREE.Group(), body = new THREE.MeshStandardMaterial({color:col, flatShading:true, roughness:0.6});
  f.add(S(new THREE.SphereGeometry(0.5,12,8),0,0.35,0,1.35,0.85,0.7,body));
  f.add(S(new THREE.ConeGeometry(0.4,0.7,4).rotateX(Math.PI/2).rotateZ(Math.PI/2),0,0.35,-0.85,0.25,1.2,1,body));
  f.add(S(new THREE.ConeGeometry(0.2,0.4,4),0,0.85,-0.05,0.4,1,1,body));
  for(const sx of [-1,1]){ f.add(S(new THREE.SphereGeometry(0.13,8,6),sx*0.27,0.5,0.55,1,1,1,whiteM)); f.add(S(new THREE.SphereGeometry(0.07,6,5),sx*0.3,0.5,0.66,1,1,1,blackM)); }
  f.scale.setScalar(1.09); return f;
}
function makeCrab(col=0xFF7B6B, sc=0.96){
  const c = new THREE.Group(), red = new THREE.MeshStandardMaterial({color:col, flatShading:true, roughness:0.6});

function doodleCanvas(){
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 512;
  const x = cv.getContext('2d');
  const draw = ()=>{
    x.fillStyle = '#FFFDF4'; x.fillRect(0,0,1024,512);
    const col = ['#FF6FA5','#3F8CFF','#FFB300','#2DBE9C','#8B6CFF','#FF7A3D'];
    let seed = 7; const r = ()=> (seed = (seed*1103515245+12345) & 0x7fffffff) / 0x7fffffff;
    x.lineCap = 'round'; x.lineJoin = 'round';
    for(let i=0;i<14;i++){ x.strokeStyle = col[i%6]; x.lineWidth = 5+r()*5; x.beginPath();
      let px = r()*1024, py = r()*512; x.moveTo(px,py);
      for(let k=0;k<5;k++){ px += (r()-0.5)*160; py += (r()-0.5)*120; x.lineTo(px,py); } x.stroke(); }
    const words = ['b','p','m','f','d','t','ng','ai','a','i','u','e','o','h','k','g'];
    words.forEach((w,i)=>{
      const cx = 70 + (i%8)*130 + (r()-0.5)*30, cy = 120 + Math.floor(i/8)*210 + (r()-0.5)*40;
      x.save(); x.translate(cx,cy); x.rotate((r()-0.5)*0.7);
      x.font = `bold ${80+r()*40}px Huninn, "Arial Rounded MT Bold", sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.lineWidth = 12; x.strokeStyle = '#FFFFFF'; x.strokeText(w,0,0);
      x.fillStyle = col[(i*5)%6]; x.fillText(w,0,0); x.restore();
    });
    for(let i=0;i<7;i++){ x.fillStyle = col[(i*2+1)%6]; const sx = 40+r()*940, sy = 30+r()*450;
      if(i%2){ x.beginPath(); for(let k=0;k<10;k++){ const a = k*Math.PI/5-Math.PI/2, rr = k%2?9:22; x.lineTo(sx+Math.cos(a)*rr, sy+Math.sin(a)*rr);} x.fill(); }
      else { x.beginPath(); x.arc(sx,sy,12,0,7); x.fill(); } }
  };
  draw();
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ draw(); tex.needsUpdate = true; });
  return tex;
}

  dg.traverse(o=>{ if(!o.isMesh) return;

    spots.push(bb);
    for(const x of [bb.min.x, bb.max.x]) for(const z of [bb.min.z, bb.max.z]) R0 = Math.max(R0, Math.hypot(x, z));
  });

/* 在空地補上花叢、灌木、小樹、長椅、路燈，避開已有的物件 */
function fillIsland(g, def, spots){
  const top = g.userData.top, r = def.r;
  const free = (x, z, pad)=> Math.hypot(x,z) < r*0.78 && !spots.some(b=> x>b.min.x-pad && x<b.max.x+pad && z>b.min.z-pad && z<b.max.z+pad)
    && !(def.id==='u3' && Math.abs(Math.hypot(x,z) - r*0.68) < 0.6);
  const placed = [];
  const spot = (pad)=>{ for(let i=0;i<60;i++){ const a = rnd()*Math.PI*2, d = Math.sqrt(rnd())*r*0.78, x = Math.cos(a)*d, z = Math.sin(a)*d;
      if(free(x,z,pad) && !placed.some(q=>Math.hypot(q[0]-x,q[1]-z) < pad+0.35)){ placed.push([x,z]); return [x,z]; } } return null; };
  const blossom = [C.pink, C.yellow, 0xFFFFFF, C.sky, 0xFFB86B];
  const n = Math.round(r*2.2);
  for(let i=0;i<n;i++){
    const kind = i%6;
    if(kind===0 || kind===3){                    // 花叢
      const sp = spot(0.55); if(!sp) continue; const col = blossom[(i*3)%blossom.length];
      for(let j=0;j<4;j++){ const ox = (rnd()-0.5)*0.55, oz = (rnd()-0.5)*0.55;
        add(g, new THREE.CylinderGeometry(0.02,0.02,0.22,4), mat(C.tea), sp[0]+ox, top+0.11, sp[1]+oz);
        add(g, new THREE.SphereGeometry(0.1,8,6), mat(col), sp[0]+ox, top+0.26, sp[1]+oz); }
    } else if(kind===1 || kind===4){             // 灌木
      const sp = spot(0.5); if(!sp) continue; const col = [0x66C47A, C.pink, 0x7ED6A0, C.yellow][i%4];
      add(g, new THREE.IcosahedronGeometry(0.3+rnd()*0.12,1), mat(col), sp[0], top+0.28, sp[1]);
    } else if(kind===2){                         // 小樹
      const sp = spot(0.7); if(!sp) continue; tree(g, sp[0], sp[1], 0.8+rnd()*0.5, [C.pink, C.yellow, 0x6FCB8E][i%3]);
    } else {                                     // 長椅
      const sp = spot(0.7); if(!sp) continue; const b = new THREE.Group(); b.position.set(sp[0], top, sp[1]); b.rotation.y = rnd()*Math.PI; g.add(b);
      add(b, new THREE.BoxGeometry(0.8,0.08,0.28), mat(C.wood), 0,0.3,0); add(b, new THREE.BoxGeometry(0.8,0.22,0.06), mat(C.pink), 0,0.45,-0.12);
      for(const sx of [-0.32,0.32]) add(b, new THREE.BoxGeometry(0.07,0.3,0.24), mat(C.white), sx,0.15,0);
    }
  }
  for(let i=0;i<2;i++){ const sp = spot(0.6); if(sp) lantern(g, sp[0], sp[1]); }
}

/* 道路：島與島只隔一小段水，用短短的路連起來。主島連各島，相鄰的島也互相連 */
const bridgePaths = [], traffic = {};
(function(){
  const dummy = new THREE.Object3D();
  const slabs = [], strips = [];
  const y = 0.6*ISC + 0.03;
  /* 六角形島沿著某方向的邊界距離（含土邊） */
  const rho = (d, phi)=>{ const a = 0.8660254*d.r*1.04*ISC; let best = 1e9;
    for(let k=0;k<6;k++){ const n = Math.PI/2 - ISLAND_ROT[d.id] + Math.PI/6 + k*Math.PI/3, c = Math.cos(phi-n); if(c>1e-6) best = Math.min(best, a/c); } return best; };
  const defs = [HUB, ...UNITS], byId = Object.fromEntries(defs.map(d=>[d.id,d]));
  const connect = (A, B, kind)=>{
    const pa = new THREE.Vector3(A.pos[0],0,A.pos[1]), pb = new THREE.Vector3(B.pos[0],0,B.pos[1]);
    const total = pa.distanceTo(pb), dir = pb.clone().sub(pa).normalize();
    const side = new THREE.Vector3(-dir.z,0,dir.x);
    const phi = Math.atan2(dir.z, dir.x), rA = rho(A, phi), rB = rho(B, phi+Math.PI);
    const s0 = rA - 0.35, s1 = total - (rB - 0.35);
    const L = s1 - s0, mid = pa.clone().addScaledVector(dir, (s0+s1)/2).setY(y);
    dummy.position.copy(mid); dummy.scale.set(1.1,1,L); dummy.lookAt(mid.clone().add(dir)); dummy.updateMatrix(); slabs.push(dummy.matrix.clone());
    for(const sg of [-1,1]){ const q = mid.clone().addScaledVector(side, sg*0.5).setY(y+0.07);
      dummy.position.copy(q); dummy.scale.set(1,1,L); dummy.lookAt(q.clone().add(dir)); dummy.updateMatrix(); strips.push(dummy.matrix.clone()); }
    const wa = pa.clone().addScaledVector(dir, rA*0.8).setY(y+0.05), wb = pb.clone().addScaledVector(dir, total - rB*0.8).setY(y+0.05);
    const path = new THREE.LineCurve3(wa, wb);
    bridgePaths.push({a:A.id, b:B.id, wa, wb, path, len: path.getLength(), kind});
  };
  [['u4','u2'],['u2','u1'],['u1','u3'],['u3','u5'],['u5','u6'],['u6','u4'],['u7','u4'],['u7','u6']].forEach(([a,b])=> connect(byId[a], byId[b], 'ring'));
  /* 環狀路線：沿著各地塊之間的短路，繞行一整圈（外圈）；主島上另有一圈繞著小學堂的內圈 */
  { const seq = ['u4','u2','u1','u3','u5','u6','u7'], pts = [];
    seq.forEach((from,i)=>{ const to = seq[(i+1)%seq.length];
      const r = bridgePaths.find(r=> (r.a===from && r.b===to) || (r.a===to && r.b===from));
      if(r.a===from){ pts.push(r.wa, r.wb); } else { pts.push(r.wb, r.wa); } });
    const path = new THREE.CurvePath();
    for(let j=0;j<pts.length;j++) path.add(new THREE.LineCurve3(pts[j], pts[(j+1)%pts.length]));
    traffic.outer = {path, len: path.getLength()};
    /* 每一段的中點（占整圈的比例）：奇數段是穿過地塊的路，偶數段是地塊之間的短路 */
    const segL = pts.map((q,j)=>q.distanceTo(pts[(j+1)%pts.length])), tot = segL.reduce((a,b)=>a+b,0); let cum = 0;
    const mids = segL.map(l=>{ const m = (cum+l/2)/tot; cum += l; return m; });
    traffic.outer.chord = mids.filter((_,j)=>j%2===1); traffic.outer.road = mids.filter((_,j)=>j%2===0);
    const hubPts = []; for(let k=0;k<20;k++){ const a = k/20*Math.PI*2; hubPts.push(new THREE.Vector3(Math.cos(a)*4.6, y+0.09, Math.sin(a)*4.6)); }
    const hp = new THREE.CatmullRomCurve3(hubPts, true); traffic.hub = {path:hp, len: hp.getLength()}; }
  const mk = (geo, hex, list)=>{ const im = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({color:hex, flatShading:true, roughness:0.9}), list.length);
    list.forEach((m,i)=>im.setMatrixAt(i,m)); im.receiveShadow = true; scene.add(im); };

})();

function tourPaths(ids){
  const P = id=>{ const g = groups[id]; return new THREE.Vector3(g.position.x, tourY, g.position.z); };
  const unit = id=>{ const v = P(id); return v.clone().setY(0); };
  const ringPt = (id, rad)=>{ const v = unit(id).normalize().multiplyScalar(rad); v.y = tourY; return v; };
  const stopPt = id=>{ const v = P(id).multiplyScalar(0.8); v.y = tourY; return v; };
  const A = ids[0], B = ids[1];
  const path1 = new THREE.CurvePath(); path1.add(new THREE.LineCurve3(ringPt(A,3.6), stopPt(A)));
  const aa = Math.atan2(unit(A).z, unit(A).x); let ab = Math.atan2(unit(B).z, unit(B).x), d = ab-aa; while(d>Math.PI) d-=2*Math.PI; while(d<-Math.PI) d+=2*Math.PI;
  const pts = [stopPt(A), ringPt(A,4.6)]; for(let i=1;i<=5;i++){ const an = aa + d*i/6; pts.push(new THREE.Vector3(Math.cos(an)*4.6, tourY, Math.sin(an)*4.6)); }

function updateTour(dt){
  if(!tour) return;
  const st = tour.tl[tour.i];
  if(!st || tour.t >= st.dur){
    tour.i++; tour.t = 0;
    if(tour.i >= tour.tl.length){ tourStop(); setMode('panorama'); setTab('units'); onSelect3D(null); return; }
    const n = tour.tl[tour.i]; tourSay(n.say);
    if(n.kind==='drive'){ renderUnit(n.id); onSelect3D(n.id); }
    return;
  }
  tour.t += dt;
  if(st.kind==='drive'){
    const u = Math.min(1, tour.t/st.dur), e = u<0.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2;
    const p = st.path.getPointAt(e), tg = st.path.getTangentAt(Math.min(0.999,e));
    tourCar.position.copy(p); tourCar.position.y += Math.abs(Math.sin(tour.t*14))*0.04; tourCar.rotation.y = Math.atan2(tg.x, tg.z);
  } else if(st.kind==='stay'){ tourCar.position.y = tourY + Math.abs(Math.sin(tour.t*5))*0.1; }
}
$('#btnTour').addEventListener('click', ()=>{
  if(tour){ tourStop(); setMode('panorama'); setTab('units'); onSelect3D(null); return; }
  $tourDlg.hidden = false; $('#tourGo').focus();
});
$('#tourGo').addEventListener('click', tourStart);
$('#tourNo').addEventListener('click', ()=>{ $tourDlg.hidden = true; });

/* 「回到全景」和「關聯線」二選一：全景沒有線，關聯線才有線；預設是全景 */
function setMode(m){
  if(m!=='tour') tourStop();
  $tourDlg.hidden = true;
  linksOn = (m==='links');
  $('#btnLinks').setAttribute('aria-pressed', String(linksOn));
  $('#btnReset').setAttribute('aria-pressed', String(m==='panorama'));
  $('#btnTour').setAttribute('aria-pressed', String(m==='tour'));
  refreshLinks();
}
$('#btnLinks').addEventListener('click', ()=>{
  if(linksOn) return;
  setMode('links');
  if(selected && selected!=='hub') onSelect3D(selected); else flyTo(LINKVIEW.pos.clone(), LINKVIEW.target.clone());
});
$('#btnReset').addEventListener('click', ()=>{ setMode('panorama'); setTab('units'); onSelect3D(null); });
controls.addEventListener('start', ()=>{ tween = null; $('#hint').hidden = true; if(tour){ tourStop(); setMode('panorama'); } });

if(UNITS.some(u=>u.id===initial)) onSelect3D(initial);

/* 動畫 */
const clock = new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if(tween){
    tween.k = Math.min(1, tween.k + dt/0.9);
    const k = 1 - Math.pow(1-tween.k, 3);
    camera.position.lerpVectors(tween.p0, tween.p1, k);
    controls.target.lerpVectors(tween.t0, tween.t1, k);
    if(tween.k>=1) tween = null;
  }
  if(!reduce){
        for(const s of spinners) s.rotation.y += dt*0.9;
    cloudGroup.rotation.y += dt*0.006;
    updateCritters(dt, t);
    updateDams(t);
    for(const f of pondTick) f(dt,t);
    updateRipples(dt);
    for(const c of cars){ if(c.loop){ c.t = (c.t + dt*c.speed*c.dir + 1) % 1; } else { c.t += dt*c.speed*c.dir; if(c.t>1){ c.t=1; c.dir=-1; } if(c.t<0){ c.t=0; c.dir=1; } } placeCar(c); }
    updateLinkArrows(t);
    for(const w of walkers){ if(w.loop){ w.t = (w.t + dt*w.speed*w.dir + 1) % 1; } else { w.t += dt*w.speed*w.dir; if(w.t>1){ w.t=1; w.dir=-1; } if(w.t<0){ w.t=0; w.dir=1; } } placeWalker(w, t); }
  } else {
    for(const c of cars) placeCar(c);
    updateLinkArrows(0);
    updateDams(0);
    for(const w of walkers) placeWalker(w, 0);
  }
  updateTour(dt);
  controls.update();
  renderer.render(scene, camera);
  labelR.render(scene, camera);
});
}
</script>
