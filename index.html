.tag b{font-family:var(--f-display);font-weight:700;font-size:15px}
.tag.adv .w{background:var(--tea)}

.tag.on{border-color:var(--persimmon);box-shadow:0 0 0 2px var(--persimmon)}
.pin{pointer-events:auto;font:500 12px/1.2 var(--f-body);background:var(--persimmon);color:#fff;border:0;border-radius:999px;padding:3px 7px;cursor:pointer;white-space:nowrap}

.tools{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:12px;display:flex;gap:6px;flex-wrap:wrap}

.tools button[aria-pressed="true"]{background:var(--indigo);color:var(--card);border-color:var(--indigo)}
.tools button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.hint{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:12px;font-size:12px;color:var(--muted);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 12px}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

#panel{border-left:1px solid var(--line);background:var(--card);overflow-y:auto;min-width:0;

.meta{color:var(--muted);font-size:13px;margin:6px 0 0}

  return '<ul class="links">' + arr.map(l=>`<li><a href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)}${l.s?`<small>${esc(l.s)}</small>`:''}</a></li>`).join('') + '</ul>';
}
function unitRow(u){

}
function lessonRow(l){
  return `<li><button class="row" data-lesson="${l.id}"><span class="no" style="font-size:13px;font-family:var(--f-mono)">${esc(l.code||'走讀')}</span><span><span class="t">${esc(l.title)}</span><span class="s">${esc(l.place)}</span></span><span></span></button></li>`;
}

function renderUnit(id){
  if(id==='hub'){ setTab('guide', false); return; }
  const u = unitById(id);
  const related = LINKS.filter(l=>l[0]===id||l[1]===id).map(l=>{const o=l[0]===id?l[1]:l[0];return {o,why:l[2]};});
  let extra = '';
  if(u.lessons) extra += '<h3>課文地點（9）</h3><ul class="list">' + LESSONS.map(lessonRow).join('') + '</ul>';
  if(u.reading) extra += '<h3>客家力・延伸閱讀</h3>' + linkList(READING);
  if(id==='u5'){ const l=LESSONS.find(x=>x.rel==='u5'); extra += '<h3>相關課文</h3><ul class="list">'+lessonRow(l)+'</ul>'; }
  view.innerHTML = `<div class="detail">
    <button class="back" data-back>← 全部單元</button>
    <div class="eyebrow">${u.w}${u.adv?' · 進階':''}</div>
    <h2>${u.no}　${esc(u.title)}</h2>
    <p class="q">${esc(u.q)}</p>
    <p>${esc(u.desc)}</p>
    ${u.score?`<p class="note">${esc(u.score)}</p>`:''}
    <h3>網站頁面</h3>${linkList(u.links)}
    ${related.length?`<h3>和這些單元相連 <span class="badge">初版</span></h3><div class="chips">${related.map(r=>`<button class="chip" data-unit="${r.o}" title="${esc(r.why)}">${esc(unitById(r.o).no)} ${esc(unitById(r.o).title)}・${esc(r.why)}</button>`).join('')}</div>`:''}

function renderLesson(id){

function renderSearch(q){
  const k = q.trim().toLowerCase();
  const hit = s => String(s||'').toLowerCase().includes(k);
  const us = UNITS.filter(u=>hit(u.title)||hit(u.q)||hit(u.desc)||hit(u.w));
  const ls = LESSONS.filter(l=>hit(l.title)||hit(l.place)||hit(l.code));
  const rs = READING.filter(r=>hit(r.t));
  view.innerHTML = (us.length?'<h3 class="note">單元</h3><ul class="list">'+us.map(unitRow).join('')+'</ul>':'')
    + (ls.length?'<h3 class="note">課文地點</h3><ul class="list">'+ls.map(lessonRow).join('')+'</ul>':'')
    + (rs.length?'<h3 class="note">延伸閱讀</h3>'+linkList(rs):'')
    || `<p class="note">找不到「${esc(q)}」。試試「柿餅」「拼音」「關西」。</p>`;
}
function setTab(t, clear=true){
  tab = t;
  for(const b of document.querySelectorAll('.tabs button')) b.setAttribute('aria-selected', String(b.id==='tab-'+t));
  if(clear){ $('#q').value=''; }
  if(t==='units') renderUnits(); else if(t==='places') renderPlaces(); else renderGuide();
}
$('#tab-units').onclick=()=>{setTab('units');onSelect3D(null);};
$('#tab-places').onclick=()=>{setTab('places');onSelect3D('u3');};
$('#tab-guide').onclick=()=>{setTab('guide');onSelect3D('hub');};
$('#q').addEventListener('input', e=>{ const v=e.target.value; if(v.trim()) renderSearch(v); else setTab(tab,false); });
view.addEventListener('click', e=>{
  const b = e.target.closest('[data-unit],[data-lesson],[data-back]');
  if(!b) return;
  if(b.dataset.back!==undefined){ setTab('units'); onSelect3D(null); return; }
  if(b.dataset.unit) select(b.dataset.unit);
  if(b.dataset.lesson) selectLesson(b.dataset.lesson);
});
function select(id){ if(id==='hub'){ setTab('guide'); } else { renderUnit(id); } onSelect3D(id); if(innerWidth<=820) $('#panel').scrollIntoView({behavior:'smooth',block:'start'}); }
function selectLesson(id){ renderLesson(id); onSelect3D('u3', id); }

const initial = (location.hash||'').slice(1);
if(UNITS.some(u=>u.id===initial)) renderUnit(initial); else if(initial==='guide') setTab('guide'); else renderUnits();

try{

}catch(err){

  throw err;
}

const stage = $('#stage');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.domElement.tabIndex = 0;

const labelR = new CSS2DRenderer();

stage.insertBefore(labelR.domElement, stage.querySelector('.tools'));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 400);
const HOME = { pos:new THREE.Vector3(2.5, 24, 41), target:new THREE.Vector3(2.5, 3, -4) };
camera.position.copy(HOME.pos);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(HOME.target);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI*0.44;
controls.minDistance = 12; controls.maxDistance = 90;
controls.enablePan = false;

const hemi = new THREE.HemisphereLight(0xffffff, 0x8aa095, 1.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3e0, 1.6);
sun.position.set(-20, 40, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-34,right:34,top:34,bottom:-34,near:1,far:120});
scene.add(sun);

const PAL = {
  light:{ sky:0xCDE6F2, water:0xBFE3A4, deep:0xAED692, sun:1.45, hemi:1.35, lamp:0.0, hill:1 },
  dark: { sky:0x1F3558, water:0x4A6B4C, deep:0x3D5A40, sun:0.6, hemi:0.75, lamp:1.4, hill:0.55 },
};
const C = { grass:0xA8DC6E, grass2:0x92CF5A, soil:0xFFE6C0, rock:0xE4DCF3, wall:0xFFF6E0, tile:0x6F86A6,
  wood:0xA9744E, tea:0x4FA64A, indigo:0x5B8DEF, persimmon:0xFF8A3D, gold:0xFFC857, white:0xFFFFFF,
  pink:0xFF9CC2, sky:0x74C0FF, yellow:0xFFD24D, glass:0xC9ECFF };
/* 每座島自己的頂面顏色：粉紅、淺藍、鵝黃輪流，只有課文島（茶園）保留綠色 */
const ISC = 1.3; /* 島（連同島上的房子與道具）整體放大倍率 */
const ISLAND_ROT = { hub:0, u1:0, u2:0, u3:0, u4:0, u5:0, u6:0, u7:0 }; /* 六角形地塊全部同方向：邊與邊互相平行，排成蜂巢狀 */
const ISLAND_COL = { hub:0xFFE58F, u1:0xFFBFD6, u2:0xA6D9FF, u3:0xB9E88A, u4:0x9CC8FF, u5:0xFFD0B0, u6:0xFFDB6E, u7:0xFFB0CF };
const M = {};
const mat = (hex, o={}) => (M[hex+JSON.stringify(o)] ||= new THREE.MeshStandardMaterial({color:hex, flatShading:true, roughness:0.85, ...o}));

/* water */
const water = new THREE.Mesh(new THREE.CircleGeometry(120, 64), new THREE.MeshStandardMaterial({color:PAL.light.water, roughness:0.6, metalness:0.05}));
water.rotation.x = -Math.PI/2; water.receiveShadow = true; scene.add(water);
const ring = new THREE.Mesh(new THREE.RingGeometry(26, 120, 64), new THREE.MeshBasicMaterial({color:PAL.light.deep, transparent:true, opacity:0.35}));
ring.rotation.x = -Math.PI/2; ring.position.y = 0.01; scene.add(ring);

/* 關西風的卡通山林：外圈淡藍綠遠山，內圈翠綠近山，山上有圓樹和杉樹，天上有雲 */
const hills = [];
const rnd = (seed => () => (seed = (seed*1664525 + 1013904223) >>> 0) / 4294967296)(20261024);
function hillMat(hex){ const m = new THREE.MeshStandardMaterial({color:hex, flatShading:true, roughness:0.95}); hills.push({m, base:new THREE.Color(hex)}); return m; }
const domeGeo = new THREE.SphereGeometry(1, 12, 7, 0, Math.PI*2, 0, Math.PI/2);
function hill(x, z, r, h, hex, withTrees){
  const mesh = new THREE.Mesh(domeGeo, hillMat(hex));
  mesh.scale.set(r, h, r*(0.85+rnd()*0.3)); mesh.rotation.y = rnd()*Math.PI; mesh.position.set(x, -0.2, z);
  scene.add(mesh);
  if(!withTrees) return;
  const n = Math.round(r*0.9);
  for(let i=0;i<n;i++){
    const a = rnd()*Math.PI*2, d = Math.sqrt(rnd())*0.78;
    const tx = x + Math.cos(a)*d*r, tz = z + Math.sin(a)*d*r*0.9, ty = h*Math.sqrt(1-d*d) - 0.4;
    const s = 0.9 + rnd()*0.8, blossom = [0xFF9CC2,0xFFD24D,0x6FCB8E,0xFFB3D1][i%4];
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12*s,0.16*s,0.8*s,5), mat(C.wood)); trunk.position.set(tx, ty+0.3*s, tz); scene.add(trunk);
    const crown = (i%3===2)
      ? new THREE.Mesh(new THREE.ConeGeometry(0.75*s, 2.2*s, 7), hillMat(0x4FB07A))
      : new THREE.Mesh(new THREE.IcosahedronGeometry(0.95*s, 0), hillMat(blossom));
    crown.position.set(tx, ty + (i%3===2 ? 1.5*s : 1.25*s), tz); scene.add(crown);
  }
}
for(let i=0;i<16;i++){ const a = i/16*Math.PI*2 + rnd()*0.2, d = 78 + rnd()*10, r = 15 + rnd()*7;
  if(Math.sin(a) > 0.1) continue;
  hill(Math.cos(a)*d, Math.sin(a)*d, r, 15 + rnd()*10, [0xB4D3FA,0xC7C0F2,0xA9DCF5][i%3], false); }
for(let i=0;i<18;i++){ const a = i/18*Math.PI*2 + rnd()*0.15, d = 50 + rnd()*8, r = 8 + rnd()*4;
  if(Math.sin(a) > 0.0) continue;
  hill(Math.cos(a)*d, Math.sin(a)*d, r, 6 + rnd()*5, [0x8EDBA8,0xFFD97A,0xF8B6CE,0xA9DCF5][i%4], true); }
const cloudMat = new THREE.MeshBasicMaterial({color:0xFFFFFF, fog:false});
const cloudGroup = new THREE.Group(); scene.add(cloudGroup);
for(let i=0;i<7;i++){
  const c = new THREE.Group(), a = i/7*Math.PI*2, d = 30 + rnd()*30;
  for(let j=0;j<4;j++){ const b = new THREE.Mesh(new THREE.IcosahedronGeometry(2.2 - Math.abs(j-1.5)*0.45, 1), cloudMat); b.position.set(j*2.2-3.3, (j%2)*0.5, 0); b.scale.y = 0.7; c.add(b); }
  c.position.set(Math.cos(a)*d, 24 + rnd()*10, Math.sin(a)*d); c.rotation.y = -a; cloudGroup.add(c);
}


/* 小河：從畫面前方的草地蜿蜒流過，河裡有大石頭、小魚、小蝦、小蟹 */
const riverCurve = new THREE.CatmullRomCurve3([[-70,18.5],[-52,16.5],[-36,20.5],[-20,17.5],[-4,21],[12,18],[28,21.5],[44,18],[60,21],[74,18]].map(([x,z])=>new THREE.Vector3(x,0.03,z)));
const riverMat = new THREE.MeshStandardMaterial({color:0x6EC6E8, roughness:0.35, metalness:0.05, flatShading:true});
function ribbon(curve, width, y, material, n=240){
  const pts = curve.getSpacedPoints(n), pos = [], idx = [];
  pts.forEach((p,i)=>{ const t = curve.getTangent(i/n); const nx = -t.z, nz = t.x; const l = Math.hypot(nx,nz)||1;
    pos.push(p.x+nx/l*width/2, y, p.z+nz/l*width/2, p.x-nx/l*width/2, y, p.z-nz/l*width/2);
    if(i<n){ const a=i*2; idx.push(a,a+2,a+1, a+1,a+2,a+3); } });
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, material); m.receiveShadow = true; scene.add(m); return m;
}
const bankMat = new THREE.MeshStandardMaterial({color:0xFFF0CC, roughness:0.95, flatShading:true});
ribbon(riverCurve, 7.2, 0.02, bankMat);
ribbon(riverCurve, 5.6, 0.05, riverMat);
const riverPoint = (t, off=0)=>{ const p = riverCurve.getPointAt(t), tg = riverCurve.getTangentAt(t); return p.clone().add(new THREE.Vector3(-tg.z,0,tg.x).multiplyScalar(off)); };
const critters = [];
const S = (g,x,y,z,sx=1,sy=1,sz=1,m)=>{ const me = new THREE.Mesh(g, m); me.position.set(x,y,z); me.scale.set(sx,sy,sz); me.castShadow = false; return me; };
const whiteM = new THREE.MeshStandardMaterial({color:0xFFFFFF, flatShading:true}), blackM = new THREE.MeshStandardMaterial({color:0x2B3A55, flatShading:true});
function makeFish(col){
  const f = new THREE.Group(), body = new THREE.MeshStandardMaterial({color:col, flatShading:true, roughness:0.6});
  f.add(S(new THREE.SphereGeometry(0.5,12,8),0,0.35,0,1.35,0.85,0.7,body));
  f.add(S(new THREE.ConeGeometry(0.4,0.7,4).rotateX(Math.PI/2).rotateZ(Math.PI/2),0,0.35,-0.85,0.25,1.2,1,body));
  f.add(S(new THREE.ConeGeometry(0.2,0.4,4),0,0.85,-0.05,0.4,1,1,body));
  for(const sx of [-1,1]){ f.add(S(new THREE.SphereGeometry(0.13,8,6),sx*0.27,0.5,0.55,1,1,1,whiteM)); f.add(S(new THREE.SphereGeometry(0.07,6,5),sx*0.3,0.5,0.66,1,1,1,blackM)); }
  f.scale.setScalar(1.7); return f;
}
function makeCrab(){
  const c = new THREE.Group(), red = new THREE.MeshStandardMaterial({color:0xFF7B6B, flatShading:true, roughness:0.6});
  c.add(S(new THREE.SphereGeometry(0.5,12,8),0,0.3,0,1.3,0.6,0.95,red));
  for(const sx of [-1,1]){
    c.add(S(new THREE.SphereGeometry(0.12,8,6),sx*0.28,0.68,0.35,1,1,1,whiteM)); c.add(S(new THREE.SphereGeometry(0.06,6,5),sx*0.28,0.7,0.44,1,1,1,blackM));
    c.add(S(new THREE.SphereGeometry(0.26,8,6),sx*0.85,0.42,0.45,1.1,0.8,1,red)); c.add(S(new THREE.BoxGeometry(0.28,0.1,0.1),sx*0.55,0.36,0.3,1,1,1,red));
    for(let i=0;i<3;i++) c.add(S(new THREE.CylinderGeometry(0.04,0.04,0.5,5).rotateZ(Math.PI/2),sx*0.75,0.12,-0.3+i*0.22,1,1,1,red));
  }
  c.scale.setScalar(1.5); return c;
}
function makeShrimp(){
  const g = new THREE.Group(), pk = new THREE.MeshStandardMaterial({color:0xFFB08A, flatShading:true, roughness:0.6});
  [[0,0.5,0.45,0.32],[0,0.6,0.1,0.3],[0,0.55,-0.22,0.26],[0,0.38,-0.48,0.2],[0,0.2,-0.62,0.15]].forEach(([x,y,z,r])=>g.add(S(new THREE.SphereGeometry(r,10,8),x,y,z,1,1,1,pk)));
  g.add(S(new THREE.ConeGeometry(0.16,0.3,4).rotateX(-Math.PI/2),0,0.15,-0.82,1.4,1,1,pk));
  for(const sx of [-1,1]){ g.add(S(new THREE.SphereGeometry(0.08,8,6),sx*0.14,0.62,0.7,1,1,1,whiteM)); g.add(S(new THREE.SphereGeometry(0.04,6,5),sx*0.14,0.63,0.77,1,1,1,blackM));
    g.add(S(new THREE.CylinderGeometry(0.015,0.015,0.9,4).rotateX(Math.PI/2.4),sx*0.15,0.72,1.0,1,1,1,pk)); }
  g.scale.setScalar(1.7); return g;
}
function makeRock(r, hex){ const m = new THREE.Mesh(new THREE.DodecahedronGeometry(r,0), new THREE.MeshStandardMaterial({color:hex, flatShading:true, roughness:0.95}));

    let seed = 7; const r = ()=> (seed = (seed*1103515245+12345) & 0x7fffffff) / 0x7fffffff;
    x.lineCap = 'round'; x.lineJoin = 'round';
    for(let i=0;i<14;i++){ x.strokeStyle = col[i%6]; x.lineWidth = 5+r()*5; x.beginPath();
      let px = r()*1024, py = r()*512; x.moveTo(px,py);
      for(let k=0;k<5;k++){ px += (r()-0.5)*160; py += (r()-0.5)*120; x.lineTo(px,py); } x.stroke(); }
    const words = ['b','p','m','f','d','t','ng','ai','a','i','u','e','o','h','k','g'];
    words.forEach((w,i)=>{
      const cx = 70 + (i%8)*130 + (r()-0.5)*30, cy = 120 + Math.floor(i/8)*210 + (r()-0.5)*40;
      x.save(); x.translate(cx,cy); x.rotate((r()-0.5)*0.7);
      x.font = `bold ${80+r()*40}px Huninn, "Arial Rounded MT Bold", sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.lineWidth = 12; x.strokeStyle = '#FFFFFF'; x.strokeText(w,0,0);
      x.fillStyle = col[(i*5)%6]; x.fillText(w,0,0); x.restore();
    });
    for(let i=0;i<7;i++){ x.fillStyle = col[(i*2+1)%6]; const sx = 40+r()*940, sy = 30+r()*450;
      if(i%2){ x.beginPath(); for(let k=0;k<10;k++){ const a = k*Math.PI/5-Math.PI/2, rr = k%2?9:22; x.lineTo(sx+Math.cos(a)*rr, sy+Math.sin(a)*rr);} x.fill(); }
      else { x.beginPath(); x.arc(sx,sy,12,0,7); x.fill(); } }
  };
  draw();
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;

function placeIsland(def, decorFn){
  const g = island(def.r, def.tiers, ISLAND_COL[def.id], ISLAND_ROT[def.id]);
  g.position.set(def.pos[0], def.id==='hub' ? 0.04 : 0, def.pos[1]);
  g.userData.id = def.id;
  g.userData.phase = Math.random()*Math.PI*2;
  g.scale.setScalar(ISC);
  scene.add(g); groups[def.id] = g;
  /* 島上的建物與道具放進一個子群組，依島的大小自動放大到佔滿島面約八成 */
  const dg = new THREE.Group(); dg.position.y = g.userData.top; dg.userData.top = 0; g.add(dg);
  decorFn(dg);
  g.updateMatrixWorld(true);
  const gi = new THREE.Matrix4().copy(g.matrixWorld).invert();
  const spots = [];
  let R0 = 0.5;
  dg.traverse(o=>{ if(!o.isMesh) return;
    const bb = new THREE.Box3().setFromObject(o).applyMatrix4(gi);
    spots.push(bb);
    for(const x of [bb.min.x, bb.max.x]) for(const z of [bb.min.z, bb.max.z]) R0 = Math.max(R0, Math.hypot(x, z));
  });
  const k = Math.min(1.7, Math.max(0.55, def.r*0.72/R0));
  dg.scale.setScalar(k);
  g.updateMatrixWorld(true);
  spots.length = 0;
  dg.traverse(o=>{ if(o.isMesh) spots.push(new THREE.Box3().setFromObject(o).applyMatrix4(gi)); });
  fillIsland(g, def, spots);
  g.traverse(o=>{ if(o.isMesh) pickables.push(o); });
  return g;
}
/* 在空地補上花叢、灌木、小樹、長椅、路燈，避開已有的物件 */
function fillIsland(g, def, spots){
  const top = g.userData.top, r = def.r;
  const free = (x, z, pad)=> Math.hypot(x,z) < r*0.78 && !spots.some(b=> x>b.min.x-pad && x<b.max.x+pad && z>b.min.z-pad && z<b.max.z+pad)
    && !(def.id==='u3' && Math.abs(Math.hypot(x,z) - r*0.68) < 0.6);
  const placed = [];
  const spot = (pad)=>{ for(let i=0;i<60;i++){ const a = rnd()*Math.PI*2, d = Math.sqrt(rnd())*r*0.78, x = Math.cos(a)*d, z = Math.sin(a)*d;
      if(free(x,z,pad) && !placed.some(q=>Math.hypot(q[0]-x,q[1]-z) < pad+0.35)){ placed.push([x,z]); return [x,z]; } } return null; };
  const blossom = [C.pink, C.yellow, 0xFFFFFF, C.sky, 0xFFB86B];
  const n = Math.round(r*2.2);
  for(let i=0;i<n;i++){
    const kind = i%6;
    if(kind===0 || kind===3){                    // 花叢
      const sp = spot(0.55); if(!sp) continue; const col = blossom[(i*3)%blossom.length];
      for(let j=0;j<4;j++){ const ox = (rnd()-0.5)*0.55, oz = (rnd()-0.5)*0.55;
        add(g, new THREE.CylinderGeometry(0.02,0.02,0.22,4), mat(C.tea), sp[0]+ox, top+0.11, sp[1]+oz);
        add(g, new THREE.SphereGeometry(0.1,8,6), mat(col), sp[0]+ox, top+0.26, sp[1]+oz); }
    } else if(kind===1 || kind===4){             // 灌木
      const sp = spot(0.5); if(!sp) continue; const col = [0x66C47A, C.pink, 0x7ED6A0, C.yellow][i%4];
      add(g, new THREE.IcosahedronGeometry(0.3+rnd()*0.12,1), mat(col), sp[0], top+0.28, sp[1]);
    } else if(kind===2){                         // 小樹
      const sp = spot(0.7); if(!sp) continue; tree(g, sp[0], sp[1], 0.8+rnd()*0.5, [C.pink, C.yellow, 0x6FCB8E][i%3]);
    } else {                                     // 長椅
      const sp = spot(0.7); if(!sp) continue; const b = new THREE.Group(); b.position.set(sp[0], top, sp[1]); b.rotation.y = rnd()*Math.PI; g.add(b);
      add(b, new THREE.BoxGeometry(0.8,0.08,0.28), mat(C.wood), 0,0.3,0); add(b, new THREE.BoxGeometry(0.8,0.22,0.06), mat(C.pink), 0,0.45,-0.12);
      for(const sx of [-0.32,0.32]) add(b, new THREE.BoxGeometry(0.07,0.3,0.24), mat(C.white), sx,0.15,0);
    }
  }
  for(let i=0;i<2;i++){ const sp = spot(0.6); if(sp) lantern(g, sp[0], sp[1]); }
}

  /* 六角形島沿著某方向的邊界距離（含土邊） */
  const rho = (d, phi)=>{ const a = 0.8660254*d.r*1.04*ISC; let best = 1e9;
    for(let k=0;k<6;k++){ const n = Math.PI/2 - ISLAND_ROT[d.id] + Math.PI/6 + k*Math.PI/3, c = Math.cos(phi-n); if(c>1e-6) best = Math.min(best, a/c); } return best; };
  const defs = [HUB, ...UNITS], byId = Object.fromEntries(defs.map(d=>[d.id,d]));
  const connect = (A, B, kind)=>{
    const pa = new THREE.Vector3(A.pos[0],0,A.pos[1]), pb = new THREE.Vector3(B.pos[0],0,B.pos[1]);
    const total = pa.distanceTo(pb), dir = pb.clone().sub(pa).normalize();
    const side = new THREE.Vector3(-dir.z,0,dir.x);
    const phi = Math.atan2(dir.z, dir.x), rA = rho(A, phi), rB = rho(B, phi+Math.PI);
    const s0 = rA - 0.35, s1 = total - (rB - 0.35);

    const path = new THREE.LineCurve3(wa, wb);
    bridgePaths.push({path, len: path.getLength(), kind});
  };
  [['u4','u2'],['u2','u1'],['u1','u3'],['u3','u5'],['u5','u6'],['u6','u4'],['u7','u4'],['u7','u6']].forEach(([a,b])=> connect(byId[a], byId[b], 'ring'));
  const mk = (geo, hex, list)=>{ const im = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({color:hex, flatShading:true, roughness:0.9}), list.length);

  bridgePaths.filter((b,i)=>i%2===0).forEach((bp,i)=>{
    const car = makeCar(cols[i%cols.length]); carGroup.add(car);
    cars.push({car, bp, t:Math.random(), dir:i%2?1:-1, speed:1.1/bp.len*(0.8+Math.random()*0.5)});
  });
}
function placeCar(c){
  const t = Math.min(1, Math.max(0, c.t));
  const p = c.bp.path.getPointAt(t), tan = c.bp.path.getTangentAt(t).multiplyScalar(c.dir);
  c.car.position.copy(p); c.car.rotation.y = Math.atan2(tan.x, tan.z);
}

/* 走路的人：在橋上往返，走到島中央再折返 */
const walkers = [];
(function(){
  const shirts = [C.pink, C.sky, C.yellow, 0x7ED6A0, C.persimmon, 0xB79CFF], hairs = [0x3A2A22, 0x1E1B1B, 0x8A5A3A];
  let k = 0;
  bridgePaths.filter((b,i)=>i%2===1).forEach((bp, bi)=>{
    const n = 1;
    for(let j=0;j<n;j++,k++){
      const g = new THREE.Group();
      add(g, new THREE.CapsuleGeometry(0.13,0.2,3,8), mat(shirts[k%shirts.length]), 0, 0.42, 0);
      add(g, new THREE.SphereGeometry(0.12,10,8), mat(0xFFDDBB), 0, 0.75, 0);
      add(g, new THREE.SphereGeometry(0.125,10,6,0,Math.PI*2,0,Math.PI*0.55), mat(hairs[k%hairs.length]), 0, 0.77, -0.005);
      const legs = [-0.06,0.06].map(x=>{ const l = new THREE.Group(); l.position.set(x,0.26,0); g.add(l); add(l, new THREE.CylinderGeometry(0.04,0.04,0.24,6), mat(0x4B5D8A), 0,-0.12,0); return l; });
      g.scale.setScalar(1.1); scene.add(g);
      walkers.push({g, legs, bp, t:(j+Math.random()*0.5)/n, dir:(k%2?1:-1), speed:0.9/bp.len*(0.8+Math.random()*0.5), ph:Math.random()*6});
    }
  });
})();
function placeWalker(w, tm){
  const t = Math.min(1, Math.max(0, w.t));
  const p = w.bp.path.getPointAt(t), tan = w.bp.path.getTangentAt(t).multiplyScalar(w.dir);
  w.g.position.copy(p); w.g.position.y += Math.abs(Math.sin(tm*7+w.ph))*0.03;
  w.g.rotation.y = Math.atan2(tan.x, tan.z);
  const sw = Math.sin(tm*7+w.ph)*0.6; w.legs[0].rotation.x = sw; w.legs[1].rotation.x = -sw;
}

/* 主題 */
function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  if(t==='dark') return true; if(t==='light') return false;
  return matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyTheme(){
  const p = isDark()? PAL.dark : PAL.light;
  scene.background = new THREE.Color(p.sky);
  scene.fog = new THREE.Fog(p.sky, 90, 230);
  hills.forEach(h=>h.m.color.copy(h.base).multiplyScalar(p.hill));
  cloudMat.color.setHex(isDark()?0x9FB8C8:0xFFFFFF);
  riverMat.color.setHex(isDark()?0x3E7FA8:0x6EC6E8);
  water.material.color.setHex(p.water);
  ring.material.color.setHex(p.deep);
  sun.intensity = p.sun; hemi.intensity = p.hemi;
  lamps.forEach(l=>l.material.emissiveIntensity = p.lamp);
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

let tween = null;
let selected = null;
/* 尺寸 */
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  if(!w || !h) return;
  renderer.setSize(w, h, false); labelR.setSize(w, h);
  camera.aspect = w/h;
  const portrait = w/h < 0.8;
  camera.fov = portrait ? 52 : 38;
  camera.updateProjectionMatrix();
  /* 直式螢幕：鏡頭更高、更接近俯視，讓各島在畫面上分得開 */
  HOME.pos.set(2.5, portrait ? 46 : 24, portrait ? 42 : 41);
  HOME.target.set(2.5, portrait ? 2 : 3, portrait ? -2 : -4);
  if(!tween && !selected) controls.target.copy(HOME.target);
  if(!tween && !selected) camera.position.copy(HOME.pos);
}
new ResizeObserver(resize).observe(stage); resize();

/* 鏡頭移動 */
function flyTo(pos, target){
  if(reduce){ camera.position.copy(pos); controls.target.copy(target); return; }
  tween = { p0:camera.position.clone(), t0:controls.target.clone(), p1:pos, t1:target, k:0 };
}
onSelect3D = (id, lessonId) => {
  if(selected && labelEls[selected]) labelEls[selected].classList.remove('on');
  selected = id;
  flagLabels.forEach(o=>o.visible = id==='u3');
  linkGroup.children.forEach(l=>{ l.material.opacity = !id || id==='hub' || l.userData.ends.includes(id) ? 0.9 : 0.15; });
  if(!id){ flyTo(HOME.pos.clone(), HOME.target.clone()); return; }
  labelEls[id]?.classList.add('on');
  const g = groups[id];
  const t = g.position.clone().setY(g.userData.top*ISC);
  const off = new THREE.Vector3(0, 13, 15).multiplyScalar(ISC);
  if(id==='u3') off.set(4, 10, 12).multiplyScalar(ISC);
  flyTo(t.clone().add(off), t);
  if(lessonId && flagMeshes[lessonId]){
    flagMeshes[lessonId].scale.set(1.6,1.6,1.6);
    setTimeout(()=>flagMeshes[lessonId].scale.set(1,1,1), 1600);
  }
};

/* 點選 */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', e=>{ down = {x:e.clientX, y:e.clientY}; });
renderer.domElement.addEventListener('pointerup', e=>{
  if(!down || Math.hypot(e.clientX-down.x, e.clientY-down.y) > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  if(!hit) return;
  if(hit.object.userData.lesson){ selectLesson(hit.object.userData.lesson); return; }
  let o = hit.object; while(o && !o.userData.id) o = o.parent;
  if(o) select(o.userData.id);
});
renderer.domElement.addEventListener('pointermove', e=>{
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr, camera);
  renderer.domElement.style.cursor = ray.intersectObjects(pickables, false).length ? 'pointer' : 'grab';
});
renderer.domElement.addEventListener('keydown', e=>{
  const step = 0.08;
  if(e.key==='ArrowLeft'){ rotate(step); } else if(e.key==='ArrowRight'){ rotate(-step); }
});
function rotate(a){ const v = camera.position.clone().sub(controls.target); v.applyAxisAngle(new THREE.Vector3(0,1,0), a); camera.position.copy(controls.target).add(v); }

/* 工具列 */
const toggle = (btn, fn) => btn.addEventListener('click', ()=>{ const on = btn.getAttribute('aria-pressed')!=='true'; btn.setAttribute('aria-pressed', String(on)); fn(on); });
toggle($('#btnLinks'), on=>linkGroup.visible = on);
toggle($('#btnCars'), on=>carGroup.visible = on);
$('#btnReset').addEventListener('click', ()=>{ setTab('units'); onSelect3D(null); });
controls.addEventListener('start', ()=>{ tween = null; $('#hint').hidden = true; });

if(UNITS.some(u=>u.id===initial)) onSelect3D(initial);

/* 動畫 */
const clock = new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if(tween){
    tween.k = Math.min(1, tween.k + dt/0.9);
    const k = 1 - Math.pow(1-tween.k, 3);
    camera.position.lerpVectors(tween.p0, tween.p1, k);
    controls.target.lerpVectors(tween.t0, tween.t1, k);
    if(tween.k>=1) tween = null;
  }
  if(!reduce){
        for(const s of spinners) s.rotation.y += dt*0.9;
    cloudGroup.rotation.y += dt*0.006;
    updateCritters(dt, t);
    for(const c of cars){ c.t += dt*c.speed*c.dir; if(c.t>1){ c.t=1; c.dir=-1; } if(c.t<0){ c.t=0; c.dir=1; } placeCar(c); }
    linkGroup.children.forEach(l=>{ l.material.dashOffset = -t*0.8; });
    for(const w of walkers){ w.t += dt*w.speed*w.dir; if(w.t>1){ w.t=1; w.dir=-1; } if(w.t<0){ w.t=0; w.dir=1; } placeWalker(w, t); }
  } else {
    for(const c of cars) placeCar(c);
    for(const w of walkers) placeWalker(w, 0);
  }
  controls.update();
  renderer.render(scene, camera);
  labelR.render(scene, camera);
});
}
</script>
