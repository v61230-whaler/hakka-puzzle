<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>仙平先生个課程拼圖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
/* Layout: 3D island scene fills the stage; a reading panel sits right (desktop) or below (phone). */
:root{
  --bg:#F1F7FF; --fg:#2A3F63; --muted:#5F76A0; --line:#D3E3FA; --card:#FFFFFF; --chip:#E5F0FF;
  --indigo:#3F7FE0; --persimmon:#E64F86; --tea:#3F9A3F; --sun:#FFC83D; --focus:#2F6FB3;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"Huninn","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B2B4A; --fg:#EAF1FF; --muted:#B3C4E3; --line:#34507F; --card:#223760; --chip:#2C4676;
  --indigo:#9CC4FF; --persimmon:#FF9DBD; --tea:#A6DE86; --sun:#FFD966; --focus:#8CC4FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B2B4A; --fg:#EAF1FF; --muted:#B3C4E3; --line:#34507F; --card:#223760; --chip:#2C4676;
  --indigo:#9CC4FF; --persimmon:#FF9DBD; --tea:#A6DE86; --sun:#FFD966; --focus:#8CC4FF; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
#app{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:100%} /* 右側說明欄 400→300（教師 2026-11-13：縮 1/4，讓全景多一些寬度） */
#stage{position:relative;overflow:hidden;min-width:0;background:var(--bg)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.labels{position:absolute;inset:0;pointer-events:none}
.tag{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:999px;
  background:var(--card);color:var(--fg);border:2px solid var(--line);font:500 13px/1.3 var(--f-body);
  cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 rgba(42,63,99,.14);transition:transform .15s}
.tag:hover{transform:translateY(-2px)}
.tag:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tag .w{font:500 10px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--card);background:var(--indigo);padding:3px 5px;border-radius:999px}
.tag b{font-family:var(--f-display);font-weight:700;font-size:15px}
.tag.adv .w{background:var(--tea)}
.tag.hub{padding:6px 14px;border-color:var(--persimmon)}
.tag.hub b{font-size:17px}
.linkbtn{pointer-events:auto;margin-top:44px;width:38px;height:38px;border-radius:50%;border:2px solid #fff;background:#6B5BD2;display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 rgba(20,30,50,.28);padding:0}   /* 進到教室地塊才出現的 link 鈕（教師 2026-11-27） */
.linkbtn svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.linkbtn[aria-pressed="true"]{box-shadow:0 0 0 2px #fff,0 0 0 5px #6B5BD2}
.linkbtn[hidden]{display:none}
.linkbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tag.bridge{pointer-events:auto;text-decoration:none;cursor:pointer;background:#2F7CC4;color:#fff;border-color:#fff;padding:3px 14px}
.tag.bridge b{font-size:15px}
.tag.cam{padding:5px 9px;font-size:20px;line-height:1;background:#7A6BC9}
.tag.on{border-color:var(--persimmon);box-shadow:0 0 0 2px var(--persimmon)}
.tag.spot{padding:3px 11px 3px 8px;gap:5px;background:#1B7F6B;color:#fff;border-color:#fff}
.tag.spot::before{content:'';width:9px;height:9px;border-radius:50%;background:#fff;flex:none}
.tag.spot b{font-size:13px;color:#fff}

.tag.spot.lead[hidden]{display:none!important}
.tag.spot.lead::before{background:#FF2B2B;width:10px;height:10px;animation:dogblink 1s infinite}
.tag.spot.on{border-color:var(--persimmon);background:#146654}
.mkit{display:inline-block;margin:2px 10px 2px 0;white-space:nowrap}
.mkp{font-size:.82em;opacity:.75}
#stage.spotview .tag{display:none}
.mnav{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;background:#1B7F6B;color:#fff;border:2px solid #fff;font:700 15px/1.2 var(--f-body);cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 rgba(42,63,99,.2);transition:transform .15s}
.mnav:hover{transform:translateY(-2px)}
.mnav[hidden]{display:none}
.mnav .arr{font-size:22px;line-height:1}
.spotback{margin-left:8px;font:inherit;border:2px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:2px 12px;cursor:pointer}
.pin{pointer-events:auto;font:500 12px/1.2 var(--f-body);background:var(--persimmon);color:#fff;border:0;border-radius:999px;padding:3px 7px;cursor:pointer;white-space:nowrap}
.pin:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.tools{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:12px;display:flex;gap:6px;flex-wrap:wrap}
.tools button{display:inline-flex;align-items:center;gap:6px;font:700 13px/1 var(--f-body);color:#fff;background:var(--c);border:2px solid #fff;border-radius:999px;padding:8px 14px 8px 11px;cursor:pointer;box-shadow:0 3px 0 rgba(20,30,50,.28)}
.tools button svg{width:15px;height:15px;flex:none;fill:none;stroke:#fff;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tools button svg .f{fill:#fff;stroke:none}
.tools button:hover{filter:brightness(1.08)}
.tools button[aria-pressed="true"]{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--c)} /* 目前所在的模式：外面多一圈同色框 */
#btnLinks{--c:#6B5BD2}#btnReset{--c:#2F6FD6}#btnTour{--c:#C4521D}#btnDog{--c:#1F8A5B}#btnEagle{--c:#8A5A2B}
/* 帶看轉盤（教師 2026-11-27）：探險隊／狗狗視角／老鷹視角收成一顆，◀ ▶ 或滑鼠滾輪切換，按中間開始 */
.dial{display:inline-flex;align-items:stretch;background:var(--c);border:2px solid #fff;border-radius:999px;box-shadow:0 3px 0 rgba(20,30,50,.28);transition:background .2s}
.dial.on{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--c)}
.tools .dial button{background:transparent;border:0;box-shadow:none;border-radius:999px;padding:8px 6px}
.tools .dial .dgo{min-width:92px;justify-content:center;padding:8px 6px}
.tools .dial .dar{font-size:11px;padding:8px 9px;opacity:.85}
.tools .dial .dar:hover{opacity:1;background:rgba(255,255,255,.18)}
.dial .dgo span{display:inline-block;transition:transform .18s,opacity .18s}
.dial.spin-l .dgo span{transform:translateX(-10px);opacity:0}.dial.spin-r .dgo span{transform:translateX(10px);opacity:0}
.tools button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tools button[hidden]{display:none}
/* 摘草莓、仙草凍：摘下後畫面中央跳出嘴巴把它吃掉，3 秒後消失 */
#guideArr{position:absolute;z-index:2999999;pointer-events:none;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#E8574A;color:#fff;font:700 15px/1.2 var(--f-body);box-shadow:0 2px 8px rgba(0,0,0,.25);transform:translate(-50%,-50%);white-space:nowrap}
#guideArr[hidden]{display:none}
#guideArr .ar{display:inline-block;font-size:20px;line-height:1}
#eat{position:absolute;left:50%;top:42%;width:min(300px,68vw);transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:3000000;transition:opacity .25s,transform .25s}
#eat.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#eat svg{width:100%;height:auto;display:block;overflow:visible}
#eat::before{content:'';position:absolute;left:2%;right:2%;top:2%;bottom:2%;border-radius:50%;background:rgba(255,255,255,.86);box-shadow:0 6px 24px rgba(42,63,99,.25)}
#eat svg{position:relative}
#eat .say{position:absolute;left:50%;bottom:-8%;transform:translateX(-50%);z-index:2;white-space:nowrap;padding:6px 18px;border-radius:999px;background:#E8574A;color:#fff;font:700 24px/1.2 var(--f-body);opacity:0;transition:opacity .2s}
#eat.eat .say:not(:empty){opacity:1}
#eat .it,#eat .mouth{display:none}
#eat.sprig .it.sprig{display:block}
#eat.eat.berry .it.berry,#eat.eat.jelly .it.jelly{display:block}
#eat.eat .mouth{display:block}
#eat .food,#eat .sw{transform-box:fill-box;transform-origin:center}
#eat.sprig .sw{animation:eSway .5s ease-in-out infinite alternate}
#eat .mo,#eat .mc,#eat .bl{animation-duration:3s;animation-timing-function:ease-in-out;animation-fill-mode:forwards;animation-play-state:paused;transform-box:fill-box;transform-origin:center 20%}
#eat.eat .mo,#eat.eat .mc,#eat.eat .bl,#eat.eat .food{animation-play-state:running}
#eat .mo{animation-name:eOpen}#eat .mc{animation-name:eClose}#eat .bl{animation-name:eCheek}
#eat .food{animation:eFood 3s linear forwards;animation-play-state:paused}
#eat.rst .mo,#eat.rst .mc,#eat.rst .bl,#eat.rst .food{animation:none}
@keyframes eSway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes eOpen{0%{transform:scaleY(.04)}10%,20%{transform:scaleY(1)}25%,30%{transform:scaleY(.04)}35%,40%{transform:scaleY(1)}45%,50%{transform:scaleY(.04)}55%,60%{transform:scaleY(1)}65%,70%{transform:scaleY(.04)}78%,84%{transform:scaleY(.8)}92%,100%{transform:scaleY(.04)}}
@keyframes eClose{0%{opacity:1}8%,22%{opacity:0}25%,30%{opacity:1}33%,42%{opacity:0}45%,50%{opacity:1}53%,62%{opacity:0}65%,76%{opacity:1}78%,84%{opacity:0}90%,100%{opacity:1}}
@keyframes eCheek{0%{transform:scale(1)}25%,30%{transform:scale(1.25)}35%,40%{transform:scale(1)}45%,50%{transform:scale(1.25)}55%,60%{transform:scale(1)}65%,70%{transform:scale(1.3)}80%,100%{transform:scale(1)}}
@keyframes eFood{0%{transform:translateY(-100px) scale(1);opacity:1}12%{transform:translateY(-4px) scale(1);opacity:1}22%{transform:translateY(0px) scale(1);opacity:1}24%{transform:translateY(0px) scale(1);opacity:0}31%{transform:translateY(0px) scale(0.66);opacity:0}34%{transform:translateY(0px) scale(0.66);opacity:1}42%{transform:translateY(0px) scale(0.66);opacity:1}44%{transform:translateY(0px) scale(0.66);opacity:0}51%{transform:translateY(0px) scale(0.33);opacity:0}54%{transform:translateY(0px) scale(0.33);opacity:1}62%{transform:translateY(0px) scale(0.33);opacity:1}64%{transform:translateY(0px) scale(0.33);opacity:0}65%{transform:translateY(0px) scale(0);opacity:0}100%{transform:translateY(0px) scale(0);opacity:0}}
@media (prefers-reduced-motion: reduce){#eat,#eat.on{transition:none}#eat.sprig .sw{animation:none}}
.notes{margin:0 0 8px;padding-left:1.3em;font-size:14px;line-height:1.7}
.hint{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:12px;font-size:12px;color:var(--muted);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 12px;max-width:calc(100% - 28px);line-height:1.5}
.tour-dialog{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:2000000;width:min(88%,380px);box-sizing:border-box;text-align:center;
  background:var(--card);color:var(--fg);border:3px solid var(--sun);border-radius:26px;padding:20px 20px 18px;box-shadow:0 8px 0 rgba(42,63,99,.16),0 0 0 100vmax rgba(30,50,90,.32)}
.tour-dialog p{margin:0 0 14px;font:700 18px/1.55 var(--f-display);text-wrap:balance}
.tour-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tour-btns button{font:700 15px/1 var(--f-body);border-radius:999px;padding:11px 18px;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--fg)}
.tour-btns #tourGo{background:var(--persimmon);border-color:var(--persimmon);color:#fff}
.tour-btns button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.gal{position:absolute;inset:0;z-index:2000001;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(20,32,58,.86);padding:16px;box-sizing:border-box}
.gal[hidden]{display:none}
.teacard{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:2000001;width:min(90%,420px);box-sizing:border-box;background:var(--card);color:var(--fg);
  border:3px solid #B4553C;border-radius:22px;padding:18px 20px 16px;box-shadow:0 8px 0 rgba(42,63,99,.16),0 0 0 100vmax rgba(30,50,90,.32)}
.teacard[hidden]{display:none}
.teacard h3{margin:0 0 10px;font:700 19px/1.3 var(--f-display);color:#9E2B22}
.teacard ul{margin:0 0 12px;padding-left:1.2em;font-size:15px;line-height:1.7}
.teacard .src{font-size:12px;color:var(--muted);margin:0 0 12px}
.teacard .row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.teacard a,.teacard button{font:700 14px/1 var(--f-body);border-radius:999px;padding:10px 16px;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--fg);text-decoration:none}
.teacard a{background:#B4553C;border-color:#B4553C;color:#fff}
.tag.tea{background:#B4553C}
.gal h3{margin:0;color:#fff;font:700 18px/1.3 var(--f-display)}
.gal .ph{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.gal img{max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.35);user-select:none;-webkit-user-drag:none}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.18);color:#fff;font:700 22px/1 var(--f-body);cursor:pointer}
.gal .nav.l{left:4px}.gal .nav.r{right:4px}
.gal .x{position:absolute;top:10px;right:12px;width:42px;height:42px;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.18);color:#fff;font:700 20px/1 var(--f-body);cursor:pointer}
.gal .dots{display:flex;gap:8px}
.gal .dots button{width:11px;height:11px;padding:0;border-radius:50%;border:2px solid #fff;background:transparent;cursor:pointer}
.gal .dots button[aria-current="true"]{background:#fff}
.gal button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tour-cap{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);z-index:2000000;max-width:min(90%,420px);box-sizing:border-box;text-align:center;
  background:var(--card);color:var(--fg);border:2px solid var(--persimmon);border-radius:20px;padding:10px 16px;font:700 16px/1.5 var(--f-display);box-shadow:0 5px 0 rgba(42,63,99,.14)}
.dogcam{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));top:12px;z-index:2000000;font:700 13px/1 var(--f-body);color:#fff;background:#E8502D;border-radius:999px;padding:8px 14px}
.dogcam::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:7px;animation:dogblink 1s infinite}
@keyframes dogblink{50%{opacity:.25}}
.dogfade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s;z-index:1999999}
.tour-cap a{color:var(--indigo)}
.tour-cap.mini{padding:4px}
.tour-cap.mini .captxt{display:none}
.tour-cap .capshow{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;padding:3px 12px 3px 5px}
.tour-cap.mini .capshow{margin-left:0}
.capshow .ic{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#2F7CC4;color:#fff;font:italic 700 14px/1 Georgia,'Times New Roman',serif}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

#panel{border-left:1px solid var(--line);background:var(--card);overflow-y:auto;min-width:0;
  padding-block:20px 28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{font:500 11px/1.4 var(--f-mono);letter-spacing:.12em;color:var(--persimmon)}
h1{font:700 32px/1.2 var(--f-display);margin:4px 0 6px;text-wrap:balance}
.lede{font-family:var(--f-display);font-size:17px;color:var(--fg);margin:0}
.meta{color:var(--muted);font-size:13px;margin:6px 0 0}
.search{margin:16px 0 12px}
.search input{width:100%;box-sizing:border-box;font:15px var(--f-body);color:var(--fg);background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:10px 16px}
.search input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);border-radius:999px;padding:4px;margin-bottom:14px}
.tabs button{font:500 14px var(--f-body);border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tabs button:focus-visible{outline:2px solid var(--focus)}
.list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:0;border-radius:18px;padding:10px 8px;color:var(--fg);cursor:pointer;font:inherit}
.row:hover{background:var(--chip)}
.row:focus-visible{outline:2px solid var(--focus)}
.row .no{font:700 22px/1 var(--f-display);color:var(--persimmon);text-align:center}
.row .no.n2{font-size:17px;letter-spacing:-1px}
.row .t{font-weight:500}
.row .s{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.row .w{font:500 10.5px/1 var(--f-mono);letter-spacing:.04em;color:var(--indigo);border:2px solid var(--line);border-radius:999px;padding:4px 7px}
.row .w.adv{color:var(--tea)}
.back{font:500 13px var(--f-body);background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 0;margin-bottom:8px}
.back:focus-visible{outline:2px solid var(--focus)}
.detail h2{font:700 26px/1.25 var(--f-display);margin:2px 0 4px}
.detail .q{font-family:var(--f-display);font-size:17px;color:var(--indigo);margin:0 0 10px}
.detail p{margin:0 0 12px}
.detail h3{font:500 12px/1.4 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.links a{display:block;color:var(--fg);text-decoration:none;border:2px solid var(--line);border-radius:16px;padding:9px 14px;font-size:14px}
.links a:hover{border-color:var(--persimmon)}
.links a:focus-visible{outline:2px solid var(--focus)}
.links a small{display:block;color:var(--muted);font-size:12px}
.links .nolink{display:block;color:var(--muted);border:2px dashed var(--line);border-radius:16px;padding:9px 14px;font-size:14px}
.links .nolink small{display:block;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px var(--f-body);background:var(--chip);color:var(--fg);border:0;border-radius:999px;padding:6px 11px;cursor:pointer}
.chip:focus-visible{outline:2px solid var(--focus)}
.note{font-size:12.5px;color:var(--muted)}
.badge{display:inline-block;font:500 11px var(--f-mono);letter-spacing:.06em;padding:3px 7px;border-radius:999px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:middle}
.score{display:flex;flex-direction:column;gap:10px}
.score .bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.score .bar i{display:block;height:100%;background:var(--persimmon)}
.score .lab{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.score .lab b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.score small{color:var(--muted);font-size:12.5px;line-height:1.4}
ol.plain{margin:0;padding-left:1.4em}
ol.plain li{margin:2px 0}
.three{display:grid;gap:8px}
.three div{border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.three b{font-family:var(--f-display);font-size:17px;color:var(--persimmon)}
.motto{font-family:var(--f-display);font-size:18px;border-left:5px solid var(--sun);padding-left:12px;margin:8px 0 4px}
.roman{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* ---------- 點擊音效（教師 2026-11-27 勾選）：全部用 WebAudio 合成，不用音檔；第一次點擊後才建立 AudioContext ---------- */
const SFX = (()=>{ let ac = null, nb = null, wheelEnd = 0;
  const A = ()=>{ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(_){ ac = null; } return ac; };
  const noise = ()=>{ if(!nb){ nb = ac.createBuffer(1, ac.sampleRate*2, ac.sampleRate); const d = nb.getChannelData(0); for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1; } return nb; };
  const env = (g,t0,a,pk,dur)=>{ g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(pk,t0+a); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur); };
  const tone = (type,f0,f1,t0,dur,pk,dest)=>{ const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f0,t0); if(f1) o.frequency.exponentialRampToValueAtTime(f1,t0+dur); env(g,t0,Math.min(0.02,dur/4),pk,dur); o.connect(g); g.connect(dest||ac.destination); o.start(t0); o.stop(t0+dur+0.05); return o; };
  const burst = (t0,dur,pk,ft,f,q,f1,dest)=>{ const s = ac.createBufferSource(); s.buffer = noise(); s.loop = true; const fl = ac.createBiquadFilter(); fl.type = ft; fl.frequency.setValueAtTime(f,t0); if(f1) fl.frequency.exponentialRampToValueAtTime(f1,t0+dur); fl.Q.value = q||1; const g = ac.createGain(); env(g,t0,Math.min(0.01,dur/5),pk,dur); s.connect(fl); fl.connect(g); g.connect(dest||ac.destination); s.start(t0, Math.random()); s.stop(t0+dur+0.05); };
  const go = f=>{ try{ if(A()) f(ac.currentTime+0.01); }catch(_){} };
  return {
    whistle(){ go(t=>{ for(const [st,du] of [[0,0.28],[0.36,0.55]]){ const o = tone('square',2900,3100,t+st,du,0.2), o2 = tone('sine',2900,3100,t+st,du,0.35); const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 32; lg.gain.value = 140; l.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency); l.start(t+st); l.stop(t+st+du+0.05); burst(t+st,du,0.12,'bandpass',3000,2); } }); },          /* 狗狗散開：裁判哨「逼—逼——」（教師：大聲、有力） */
    plop(){ go(t=>{ for(let i=0;i<5;i++){ const ti = t+0.3+i*0.06+Math.random()*0.05; tone('sine',900+Math.random()*300,220,ti,0.09,0.14); } }); },   /* 飼料落水：噗噗 */
    pop(){ go(t=>tone('sine',450,1300,t,0.07,0.13)); },                                                     /* 魚吃到一顆：啵 */
    splash(){ go(t=>{ tone('sine',320,70,t,0.28,0.45); burst(t,0.7,0.55,'lowpass',2200,0.7,350); burst(t+0.12,0.5,0.25,'bandpass',1500,0.8,600); }); },   /* 小人落水：撲通 */
    moo(){ go(t=>{ const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(105,t); o.frequency.linearRampToValueAtTime(135,t+0.35); o.frequency.linearRampToValueAtTime(100,t+1.3);
      f.type = 'lowpass'; f.frequency.setValueAtTime(350,t); f.frequency.linearRampToValueAtTime(900,t+0.4); f.frequency.linearRampToValueAtTime(400,t+1.3); f.Q.value = 4;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.18); g.gain.setValueAtTime(0.35,t+0.9); g.gain.exponentialRampToValueAtTime(0.0001,t+1.4); o.connect(f); f.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+1.45); }); },   /* 水牛：哞～ */
    flap(n=7,d=0.1){ go(t=>{ for(let i=0;i<n;i++) burst(t+d+i*0.075,0.06,0.22,'bandpass',1100+Math.random()*300,0.9); }); },   /* 振翅：啪啪 */
    chirp(){ go(t=>{ for(let i=0;i<4;i++){ const ti = t+0.15+i*0.13+Math.random()*0.04; tone('sine',3400,5200,ti,0.06,0.1); tone('sine',5000,3800,ti+0.065,0.05,0.07); } }); },   /* 麻雀：啾啾 */
    crunch(times){ go(t=>{ for(const dt of times) for(let i=0;i<3;i++) burst(t+dt+i*0.035,0.035,0.3,'bandpass',2600+Math.random()*900,1.2); }); },   /* 吃：喀滋 */

    squeak(){ go(t=>{ for(let i=0;i<3;i++){ const ti = t+i*0.09; tone('sine',5200,7400,ti,0.045,0.16); tone('triangle',7400,4800,ti+0.045,0.03,0.08); } }); },              /* 老鼠：吱吱（教師：要尖一點） */
    clack(){ go(t=>{ for(let i=0;i<3;i++) burst(t+i*0.09,0.025,0.5,'bandpass',3200,5); }); },              /* 毛蟹：喀喀 */
    bell(){ go(t=>{ [[1,0.22,4],[2.0,0.08,2.5],[2.76,0.07,2],[5.4,0.03,1.2]].forEach(([m,pk,d])=>{ const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = 196*m; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(pk,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+d+0.05); }); burst(t,0.05,0.15,'bandpass',1500,1); }); },   /* 太和宮：噹～ */
    shutter(){ go(t=>{ for(const st of [0,0.07]){ burst(t+st,0.012,0.6,'highpass',5000,0.7); tone('square',4200,2600,t+st,0.008,0.12); } burst(t+0.02,0.04,0.12,'bandpass',2500,1.5); }); },   /* 相片：喀嚓（教師：清脆一點） */
    siren(){ go(t=>{ const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(600,t);
      for(let i=0;i<2;i++){ o.frequency.linearRampToValueAtTime(1250,t+i*1.1+0.55); o.frequency.linearRampToValueAtTime(600,t+i*1.1+1.1); }
      f.type = 'lowpass'; f.frequency.value = 2400; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.16,t+0.08); g.gain.setValueAtTime(0.16,t+2.0); g.gain.exponentialRampToValueAtTime(0.0001,t+2.25); o.connect(f); f.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+2.3); }); },   /* 狗狗集合：警報聲兩下（教師選 1） */
    eagle(){ go(t=>{ for(const st of [0,0.75]){ const o = ac.createOscillator(), g = ac.createGain(), l = ac.createOscillator(), lg = ac.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(2300,t+st); o.frequency.linearRampToValueAtTime(2900,t+st+0.12); o.frequency.exponentialRampToValueAtTime(1500,t+st+0.65);

/* 2026-11-20 教師：再加一隻小隻的黑色賓士貓（黑身，白口鼻、胸、腹、腳掌），住在南邊「青菜」攤的棚頂；兩隻大多各自休息、走動，
   小貓偶爾會沿棚頂東緣（字牌擋不到的地方）跳過兩攤之間的縫，走到橘貓旁邊並排趴著，互看一下、有時一起睡，過一陣子再自己走回去。
   兩隻共用同一套程式 makeRoofCat；座標 u、w 都以粄攤棚頂中線為原點（w 往南為正，青菜攤棚頂在 w≈2.1–5.3）。 */
function makeRoofCat(cfg){
  const PX = -28.75, PY = 2.745, PZ = 5.6+MKT_DZ, SL = 0.13;   /* 粄攤棚頂的中線（世界座標）與斜度 */
  const tilt = new THREE.Group(); tilt.position.set(PX,PY,PZ); tilt.rotation.z = -SL; scene.add(tilt); /* 順著棚頂往東傾 */
  const g = new THREE.Group(); g.scale.setScalar(cfg.sc||1); tilt.add(g);
  const br = mat(cfg.col), wh = mat(0xFFFFFF), pk = mat(0xF2A0A8), amb = mat(cfg.eye), blk = mat(0x1E1A18);

  const body = S(new THREE.CapsuleGeometry(0.15,0.36,4,10).rotateX(Math.PI/2),0,0.13,0,1,0.78,1,br); bg.add(body);
  bg.add(S(new THREE.SphereGeometry(0.15,10,8),0,0.08,0.02,0.92,0.5,1.55,wh));           /* 白肚子 */
  bg.add(S(new THREE.SphereGeometry(0.13,10,8),0,0.13,0.24,1.0,0.95,0.7,wh));            /* 白胸口 */
  for(const sx of [-1,1]) bg.add(S(new THREE.SphereGeometry(0.075,8,6),sx*0.11,0.1,-0.2,0.8,0.9,1.2,br)); /* 後腿（大腿） */
  /* 四隻腳：從肩膀、臀部往下；趴著時往前伸（白前腳伸在頭前），站著時直立 */
  const legs = [];
  for(const [sx,fz] of [[-1,1],[1,1],[-1,-1],[1,-1]]){
    const p = new THREE.Group(); p.position.set(sx*(fz>0?0.075:0.1),0.07,fz>0?0.25:-0.2); bg.add(p);
    p.add(S(new THREE.CylinderGeometry(0.038,0.034,0.2,6).translate(0,-0.1,0),0,0,0,1,1,1,fz>0?wh:br));
    p.add(S(new THREE.SphereGeometry(0.045,6,5),0,-0.2,0.015,1,0.7,1.3,wh));               /* 白腳掌 */
    legs.push({p,sx,fz});
  }
  const head = new THREE.Group(); head.position.set(0,0.27,0.3); head.rotation.order = 'YXZ'; head.scale.setScalar(cfg.headK||1); bg.add(head); /* 小貓頭比例大一點 */
  head.add(S(new THREE.SphereGeometry(0.14,12,10),0,0,0,1.05,0.95,0.95,br));
  head.add(S(new THREE.SphereGeometry(0.1,10,8),0,-0.045,0.06,1.05,0.8,0.85,wh));       /* 白口鼻 */
  head.add(S(new THREE.SphereGeometry(0.035,6,5),0,0.04,0.115,0.7,1.6,0.6,wh));          /* 額頭中間的白線 */
  head.add(S(new THREE.SphereGeometry(0.018,6,5),0,-0.01,0.145,1.2,0.8,0.8,pk));          /* 粉紅鼻 */
  const eyes = [], ears = [];
  for(const sx of [-1,1]){
    const e = new THREE.Group(); e.position.set(sx*0.06,0.025,0.11); head.add(e); eyes.push(e);
    e.add(S(new THREE.SphereGeometry(0.036,8,6),0,0,0,1,1,0.7,amb)); e.add(S(new THREE.SphereGeometry(0.024,6,5),sx*0.002,0,0.022,1,1,0.5,blk));
    const ep = new THREE.Group(); ep.position.set(sx*0.085,0.08,-0.01); ep.rotation.z = -sx*0.3; head.add(ep); ears.push(ep); /* 耳朵掛在耳根，才能抖動 */
    ep.add(S(new THREE.ConeGeometry(0.05,0.1,4),0,0.04,0,1,1,0.6,br)); ep.add(S(new THREE.ConeGeometry(0.03,0.065,4),-sx*0.002,0.035,0.022,1,1,0.4,pk));
  }
  const lids = eyes.map(e=>{ const l = S(new THREE.SphereGeometry(0.03,8,6),0,-0.004,0.0,1.25,0.22,0.7,cfg.lid?mat(cfg.lid):blk); l.visible = false; e.add(l); return l; }); /* 睡覺時閉眼：眼睛換成一條細細的黑線 */
  const tail = new THREE.Group(); tail.position.set(0.1,0.06,-0.32); bg.add(tail);      /* 尾巴從屁股繞到身體側邊，尾端會甩 */
  tail.add(S(new THREE.CapsuleGeometry(0.035,0.12,3,6).rotateZ(Math.PI/2),0.05,0,-0.02,1,1,1,br));
  const tip = new THREE.Group(); tip.position.set(0.1,0,0); tail.add(tip); tip.add(S(new THREE.CapsuleGeometry(0.033,0.22,3,6).rotateX(Math.PI/2),0,0,0.13,1,1,1,br));
  { const hb = new THREE.Mesh(new THREE.BoxGeometry(0.6*(cfg.hit||1),0.6*(cfg.hit||1),1.1*(cfg.hit||1)), new THREE.MeshBasicMaterial({visible:false})); hb.position.set(0,0.25,0.05); g.add(hb); } /* 看不見的點擊範圍，比貓大一圈，學生比較好點到 */
  g.traverse(m=>{ if(m.isMesh) m.userData.mcat = true; });
  /* 睡覺時頭上冒「Z z z」（教師 2026-11-19）：三個字由小到大往上飄、淡出，永遠正面朝鏡頭 */
  const zzz = [];
  { const zc = document.createElement('canvas'); zc.width = zc.height = 128; const zx = zc.getContext('2d');
    const drawZ = ()=>{ zx.clearRect(0,0,128,128); zx.font = 'bold 100px Huninn, "Noto Sans TC", sans-serif'; zx.textAlign = 'center'; zx.textBaseline = 'middle';
      zx.lineWidth = 14; zx.lineJoin = 'round'; zx.strokeStyle = '#FFFFFF'; zx.strokeText('Z',64,68); zx.fillStyle = '#5B6FD6'; zx.fillText('Z',64,68); };
    drawZ(); const zt = new THREE.CanvasTexture(zc); zt.colorSpace = THREE.SRGBColorSpace;
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ drawZ(); zt.needsUpdate = true; });
    for(let i=0;i<3;i++){ const m = new THREE.Mesh(new THREE.PlaneGeometry(0.2*(cfg.zk||1),0.2*(cfg.zk||1)), new THREE.MeshBasicMaterial({map:zt, transparent:true, opacity:0, depthWrite:false}));

  /* 狀態：lie 趴著看、sleep 交叉前腳睡、walk 在棚頂上走（u：往東西的位置，w：往南北的位置） */
  const o = {x:PX, z:PZ+(cfg.w0||0), y:PY, g, head, watcher:null, meow:null, buddy:null, vis:null, attn:null, attnT:0, st:'lie', u:0, w:0, yaw:0};
  let st = Math.random()<0.5 ? 'sleep' : 'lie', stT = 0, stDur = 6+Math.random()*8, u = cfg.u0??0.15, w = cfg.w0||0, yaw = cfg.yaw0||0, lift = 0, slp = 0, gait = 0, cross = 0;
  let path = [], hop = null, hopY = 0, visCd = 35+Math.random()*40, visDur = 0;
  const near = a=>((a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
  const rr = a=>a[0]+Math.random()*(a[1]-a[0]), HU = cfg.home.u, HW = cfg.home.w;
  /* 兩攤棚頂之間的過道：粄攤南緣有字牌（u 到 0.88 為止），只有棚頂東緣 u≈1.08 過得去；從 w=1.3 跳到 w=2.3 */
  const GU = 1.08, GA = 1.3, GB = 2.3, roof = ww=>ww<1.85 ? 0 : 1;
  const route = (tu,tw)=>{ const p = []; if(roof(w)!==roof(tw)){ const a0 = roof(w) ? GB : GA, b0 = roof(w) ? GA : GB; p.push({u:GU,w:a0},{u:GU,w:b0,hop:true}); } p.push({u:tu,w:tw}); return p; };
  let gy = 0, gp = 0.05, gr = 0, gT = 1, bT = 2, bD = 0.14, bP = -1, eT = 3, eS = 0, eP = -1; const hv = {x:0, y:0, z:0}; /* 頭的注視點、眨眼、耳朵 */
  const pick = ()=>{ const r = Math.random(), B = o.buddy, calm = o.vis==='stay' || (B && (B.vis==='go'||B.vis==='stay')); /* 有伴在旁邊或正走過來時不走開 */
    if(r<0.45 || (calm && r<0.75)){ st = 'sleep'; stDur = 15+Math.random()*15; }
    else if(r<0.75 && !calm){ st = 'walk'; let k = 0, tu, tw; do{ tw = rr(HW); tu = rr(HU); k++; }while(Math.hypot(tu-u,tw-w)<0.7 && k<9); path = route(tu,tw); stDur = 40; }
    else { st = 'lie'; stDur = 6+Math.random()*6; } stT = 0; };
  pondTick.push((dt,t)=>{
    dt = Math.min(dt,0.1); stT += dt;
    if(cfg.watchOf) o.watcher = cfg.watchOf().watcher;                   /* 小貓也會看狗 */
    if(o.watcher && o.watcher.state!=='cat') o.watcher = null;
    if(o.watcher && st==='sleep'){ st = 'lie'; stT = 0; stDur = 4; }    /* 狗來了就醒來看 */
    const B = o.buddy;
    /* 小貓去找橘貓：只有兩隻都醒著、沒在走、沒有狗時才出發；走到橘貓東側並排 */
    if(cfg.visitor && B){
      if(!o.vis){ visCd -= dt;
        if(visCd<=0 && st==='lie' && !o.watcher && !B.watcher && B.st!=='walk'){
          const tu = Math.min(1.0, B.u+0.42), tw = Math.max(-1.2, Math.min(1.2, B.w+0.12));
          o.vis = 'go'; st = 'walk'; stT = 0; stDur = 60; path = route(tu,tw); } }
      else if(o.vis==='stay'){ visDur -= dt;
        if(visDur<=0 && st!=='walk' && !o.watcher){ o.vis = 'back'; st = 'walk'; stT = 0; stDur = 60; path = route(rr(HU), rr([2.7,4.6])); } } }
    let wantLift = 0, wantSlp = 0, moving = false;
    if(st==='walk'){
      wantLift = 1;
      if(hop){ hop.f = Math.min(1, hop.f+dt/hop.d); const f = hop.f, ef = f*f*(3-2*f);   /* 跳過兩攤之間的縫：拋物線 */
        u = hop.u0+(hop.u1-hop.u0)*ef; w = hop.w0+(hop.w1-hop.w0)*ef; hopY = Math.sin(Math.PI*f)*0.3;
        if(f>=1){ hop = null; hopY = 0; path.shift(); } }
      else if(o.watcher){ /* 被狗叫時停在原地站著看 */ }
      else if(lift>0.95 && path.length){ const P = path[0], dx = P.u-u, dz = P.w-w, dd = Math.hypot(dx,dz);
        if(dd>0.05){ const ty = Math.atan2(dx,dz), df = near(ty-yaw); yaw += Math.max(-2.5*dt, Math.min(2.5*dt, df));
          if(P.hop){ if(Math.abs(df)<0.1) hop = {u0:u, w0:w, u1:P.u, w1:P.w, f:0, d:0.55}; }
          else if(Math.abs(df)<0.5){ const v = Math.min(dd, (cfg.spd||0.32)*dt); u += Math.sin(yaw)*v; w += Math.cos(yaw)*v; moving = true; } }
        else path.shift(); }
      else if(lift>0.95){ /* 到了：順著棚頂（小貓去找伴時和橘貓同方向）再趴下 */
        const ax = o.vis==='go' && B ? B.yaw : yaw, ty = Math.abs(near(ax))<Math.PI/2 ? 0 : Math.PI, df = near(ty-yaw); yaw += Math.max(-2*dt, Math.min(2*dt, df));
        if(Math.abs(df)<0.03){ st = 'lie'; stT = 0; stDur = 5+Math.random()*5;
          if(o.vis==='go'){ o.vis = 'stay'; visDur = 25+Math.random()*35; stDur = 4+Math.random()*3; o.attn = B; o.attnT = 2.5; if(B && B.st!=='sleep'){ B.attn = o; B.attnT = 3; } }
          else if(o.vis==='back'){ o.vis = null; visCd = 80+Math.random()*100; } } }
      if(stT>stDur && !o.watcher && !hop){ path = []; st = 'lie'; stT = 0; stDur = 5;
        if(o.vis==='go'){ o.vis = 'stay'; visDur = 4; } else if(o.vis==='back' && roof(w)===1){ o.vis = null; visCd = 80+Math.random()*100; } }
    } else if(st==='sleep'){ wantSlp = 1; if(stT>stDur){ st = 'lie'; stT = 0; stDur = 3+Math.random()*3; } }
    else if(stT>stDur && !o.watcher && !(o.vis==='back')) pick();
    lift += Math.max(-dt*1.6, Math.min(dt*1.6, wantLift-lift)); slp += Math.max(-dt*0.8, Math.min(dt*(0.35), wantSlp-slp)); /* 慢慢低頭睡著，醒來較快 */
    const e = lift*lift*(3-2*lift), s = slp*slp*(3-2*slp);
    g.position.set(u,hopY,w); g.rotation.y = yaw; bg.position.y = e*0.165;
    if(moving) gait += dt*9;
    for(const L of legs){ const lie = L.fz>0 ? -Math.PI/2 : -Math.PI/2*0.92;
      const sw = moving ? Math.sin(gait+(L.sx*L.fz>0?0:Math.PI))*0.45 : 0;
      L.p.rotation.x = lie*(1-e) + sw*e + (hopY>0 ? (L.fz>0 ? -0.9 : 0.8)*Math.min(1,hopY/0.15) : 0); /* 跳的時候前腳往前伸、後腳往後蹬 */
      L.p.rotation.y = L.fz>0 ? (1-e)*s*L.sx*0.5 : 0;                 /* 睡覺時兩隻前腳往內交叉 */
      L.p.position.y = 0.07 + (L.fz>0 && L.sx>0 ? 0.03*s*(1-e) : 0); }  /* 右前腳疊在左前腳上 */
    /* 頭（教師 2026-11-18：要更自然）：真的貓不是一直左右掃，而是「盯住一處 → 很快轉過去 → 再盯住」。
       每隔 1.2–4.5 秒換一個注視點（多半小幅移動，偶爾大轉頭、抬頭看上面、歪頭），用彈簧追過去：起步快、到位前放慢、略帶一點過頭；
       另外會眨眼（偶爾慢慢眨）、單邊耳朵抖一下。睡覺時低頭靠在交叉的前腳上，隨呼吸微動；有狗時盯著狗、頭稍低、耳朵往前。 */
    gT -= dt;
    if(gT<=0){ const r = Math.random();
      if(st==='walk'){ gy = (Math.random()-0.5)*0.5; gp = 0.12+Math.random()*0.1; gr = 0; gT = 1+Math.random()*1.5; }
      else { if(r<0.55) gy = Math.max(-1.1, Math.min(1.1, gy+(Math.random()-0.5)*0.6)); else gy = (Math.random()*2-1)*1.1;
        gp = Math.random()<0.15 ? -0.25-Math.random()*0.15 : 0.0+Math.random()*0.15;   /* 偶爾抬頭看上面 */
        gr = Math.random()<0.25 ? (Math.random()<0.5?-1:1)*(0.12+Math.random()*0.1) : 0; /* 偶爾歪頭 */
        gT = 1.2+Math.random()*3.3;
        const pal = o.vis==='stay' ? B : (B && B.vis==='stay' ? B : null); if(pal && Math.random()<0.3){ o.attn = pal; o.attnT = 1.2+Math.random()*2.3; } } }

    else if(o.attn && o.attnT>0){ const aa = o.attn; ty = Math.max(-1.3, Math.min(1.3, near(Math.atan2(aa.x-o.x, aa.z-o.z) - yaw))); tp = 0.08; tr = 0; } /* 看旁邊的伴 */
    ty += 0.035*Math.sin(t*0.9)+0.02*Math.sin(t*2.3+1); tp += 0.025*Math.sin(t*1.3+2); /* 盯著時頭也有一點點自然的晃動，不會完全僵住 */

    bT -= dt; if(bT<=0){ bD = Math.random()<0.25 ? 0.5 : 0.14; bP = 0; bT = 2+Math.random()*4; }

          q.m.material.opacity = Math.min(1,(s-0.7)/0.2)*Math.sin(Math.PI*f); q.m.quaternion.copy(camera.quaternion); } } }
    o.x = PX + u*Math.cos(SL); o.z = PZ + w; o.u = u; o.w = w; o.yaw = yaw; o.st = st;

/* 文字塗鴉牆：拼音字母、星星、愛心與隨手畫的線條 */
function doodleCanvas(){
  const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 512;
  const x = cv.getContext('2d');
  const draw = ()=>{
    x.fillStyle = '#FFFDF4'; x.fillRect(0,0,1024,512);
    const col = ['#FF6FA5','#3F8CFF','#FFB300','#2DBE9C','#8B6CFF','#FF7A3D'];
    let seed = 7; const r = ()=> (seed = (seed*1103515245+12345) & 0x7fffffff) / 0x7fffffff;
    x.lineCap = 'round'; x.lineJoin = 'round';
    for(let i=0;i<14;i++){ x.strokeStyle = col[i%6]; x.lineWidth = 5+r()*5; x.beginPath();
      let px = r()*1024, py = r()*512; x.moveTo(px,py);
      for(let k=0;k<5;k++){ px += (r()-0.5)*160; py += (r()-0.5)*120; x.lineTo(px,py); } x.stroke(); }
    const words = ['b','p','m','f','d','t','ng','ai','a','i','u','e','o','h','k','g'];
    words.forEach((w,i)=>{
      const cx = 70 + (i%8)*130 + (r()-0.5)*30, cy = 120 + Math.floor(i/8)*210 + (r()-0.5)*40;
      x.save(); x.translate(cx,cy); x.rotate((r()-0.5)*0.7);
      x.font = `bold ${80+r()*40}px Huninn, "Arial Rounded MT Bold", sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.lineWidth = 12; x.strokeStyle = '#FFFFFF'; x.strokeText(w,0,0);
      x.fillStyle = col[(i*5)%6]; x.fillText(w,0,0); x.restore();
    });
    for(let i=0;i<7;i++){ x.fillStyle = col[(i*2+1)%6]; const sx = 40+r()*940, sy = 30+r()*450;
      if(i%2){ x.beginPath(); for(let k=0;k<10;k++){ const a = k*Math.PI/5-Math.PI/2, rr = k%2?9:22; x.lineTo(sx+Math.cos(a)*rr, sy+Math.sin(a)*rr);} x.fill(); }
      else { x.beginPath(); x.arc(sx,sy,12,0,7); x.fill(); } }
  };
  draw();
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ draw(); tex.needsUpdate = true; });
  return tex;
}

/* 客語海陸腔小學堂：圓弧屋頂、大窗、黑板外牆（粉筆畫與「客語海陸腔」） */
function chalkCanvas(){
  const cv = document.createElement('canvas'); cv.width = 768; cv.height = 336;
  const x = cv.getContext('2d');
  const draw = ()=>{
    x.fillStyle = '#2F6B5C'; x.fillRect(0,0,768,336);
    x.fillStyle = 'rgba(255,255,255,0.06)'; for(let i=0;i<10;i++){ x.beginPath(); x.ellipse(60+i*72, 60+(i%3)*110, 70, 22, 0.3*i, 0, 7); x.fill(); }
    x.lineCap = 'round'; x.lineJoin = 'round';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = 'bold 118px Huninn, "Noto Sans TC", sans-serif'; x.fillStyle = '#FFFFFF'; x.fillText('客語海陸腔', 384, 130);
    x.strokeStyle = '#FFD24D'; x.lineWidth = 7; x.beginPath(); x.moveTo(110,205); x.quadraticCurveTo(384,235,658,205); x.stroke();
    const star = (cx,cy,R,col)=>{ x.fillStyle = col; x.beginPath(); for(let k=0;k<10;k++){ const a=k*Math.PI/5-Math.PI/2, rr=k%2?R*0.45:R; x.lineTo(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr);} x.fill(); };
    star(90,265,26,'#FF9CC2'); star(678,270,22,'#FFD24D'); star(384,285,16,'#9CD8FF');
    x.strokeStyle = '#FF9CC2'; x.lineWidth = 6; x.beginPath(); x.arc(220,275,22,0,7); x.stroke();
    x.strokeStyle = '#9CD8FF'; x.beginPath(); x.arc(550,278,22,0,7); x.stroke();
    x.fillStyle = '#FFD24D'; x.beginPath(); x.arc(220,275,7,0,7); x.fill(); x.fillStyle = '#FF9CC2'; x.beginPath(); x.arc(550,278,7,0,7); x.fill();
  };
  draw();
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ draw(); tex.needsUpdate = true; });
  return tex;
}

  decorFn(dg);

/* 在空地補上花叢、灌木、小樹、長椅、路燈，避開已有的物件 */
function fillIsland(g, def, spots){
  const top = g.userData.top, r = def.r;
  const free = (x, z, pad)=> Math.hypot(x,z) < r*0.78 && !spots.some(b=> x>b.min.x-pad && x<b.max.x+pad && z>b.min.z-pad && z<b.max.z+pad)
    && !(def.id==='u3' && Math.abs(Math.hypot(x,z) - r*0.68) < 0.6);
  const placed = [];
  const spot = (pad)=>{ for(let i=0;i<60;i++){ const a = rnd()*Math.PI*2, d = Math.sqrt(rnd())*r*0.78, x = Math.cos(a)*d, z = Math.sin(a)*d;
      if(free(x,z,pad) && !placed.some(q=>Math.hypot(q[0]-x,q[1]-z) < pad+0.35)){ placed.push([x,z]); return [x,z]; } } return null; };
  const blossom = [C.pink, C.yellow, 0xFFFFFF, C.sky, 0xFFB86B];
  const n = Math.round(r*2.2);
  for(let i=0;i<n;i++){
    const kind = i%6;
    if(kind===0 || kind===3){                    // 花叢
      const sp = spot(0.55); if(!sp) continue; const col = blossom[(i*3)%blossom.length];
      for(let j=0;j<4;j++){ const ox = (rnd()-0.5)*0.55, oz = (rnd()-0.5)*0.55;
        add(g, new THREE.CylinderGeometry(0.02,0.02,0.22,4), mat(C.tea), sp[0]+ox, top+0.11, sp[1]+oz);
        add(g, new THREE.SphereGeometry(0.1,8,6), mat(col), sp[0]+ox, top+0.26, sp[1]+oz); }
    } else if(kind===1 || kind===4){             // 灌木
      const sp = spot(0.5); if(!sp) continue; const col = [0x66C47A, C.pink, 0x7ED6A0, C.yellow][i%4];
      add(g, new THREE.IcosahedronGeometry(0.3+rnd()*0.12,1), mat(col), sp[0], top+0.28, sp[1]);
    } else if(kind===2){                         // 小樹
      const sp = spot(0.7); if(!sp) continue; tree(g, sp[0], sp[1], 0.8+rnd()*0.5, [C.pink, C.yellow, 0x6FCB8E][i%3]);
    } else {                                     // 長椅
      const sp = spot(0.7); if(!sp) continue; const b = new THREE.Group(); b.position.set(sp[0], top, sp[1]); b.rotation.y = rnd()*Math.PI; g.add(b);
      add(b, new THREE.BoxGeometry(0.8,0.08,0.28), mat(C.wood), 0,0.3,0); add(b, new THREE.BoxGeometry(0.8,0.22,0.06), mat(C.pink), 0,0.45,-0.12);
      for(const sx of [-0.32,0.32]) add(b, new THREE.BoxGeometry(0.07,0.3,0.24), mat(C.white), sx,0.15,0);
    }
  }
  for(let i=0;i<2;i++){ const sp = spot(0.6); if(sp) lantern(g, sp[0], sp[1]); }
}

/* 道路：島與島只隔一小段水，用短短的路連起來。主島連各島，相鄰的島也互相連 */
const bridgePaths = [], traffic = {};
(function(){
  const dummy = new THREE.Object3D();
  const slabs = [], strips = [];
  const y = 0.6*ISC + 0.03;
  /* 六角形島沿著某方向的邊界距離（含土邊） */
  const rho = (d, phi)=>{ const a = 0.8660254*d.r*1.04*ISC; let best = 1e9;
    for(let k=0;k<6;k++){ const n = Math.PI/2 - ISLAND_ROT[d.id] + Math.PI/6 + k*Math.PI/3, c = Math.cos(phi-n); if(c>1e-6) best = Math.min(best, a/c); } return best; };
  const defs = [HUB, ...UNITS], byId = Object.fromEntries(defs.map(d=>[d.id,d]));
  const connect = (A, B, kind)=>{
    const pa = new THREE.Vector3(A.pos[0],0,A.pos[1]), pb = new THREE.Vector3(B.pos[0],0,B.pos[1]);
    const total = pa.distanceTo(pb), dir = pb.clone().sub(pa).normalize();
    const side = new THREE.Vector3(-dir.z,0,dir.x);
    const phi = Math.atan2(dir.z, dir.x), rA = rho(A, phi), rB = rho(B, phi+Math.PI);
    const s0 = rA - 0.35, s1 = total - (rB - 0.35);
    const L = s1 - s0, mid = pa.clone().addScaledVector(dir, (s0+s1)/2).setY(y);
    dummy.position.copy(mid); dummy.scale.set(1.1,1,L); dummy.lookAt(mid.clone().add(dir)); dummy.updateMatrix(); slabs.push(dummy.matrix.clone());
    for(const sg of [-1,1]){ const q = mid.clone().addScaledVector(side, sg*0.5).setY(y+0.07);
      dummy.position.copy(q); dummy.scale.set(1,1,L); dummy.lookAt(q.clone().add(dir)); dummy.updateMatrix(); strips.push(dummy.matrix.clone()); }
    const wa = pa.clone().addScaledVector(dir, rA*0.8).setY(y+0.05), wb = pa.clone().addScaledVector(dir, total - rB*0.8).setY(y+0.05);   /* 2026-11-28 修正：原本從 pb 再往外加，終點跑到地塊外、人懸空 */
    const path = new THREE.LineCurve3(wa, wb);
    bridgePaths.push({a:A.id, b:B.id, wa, wb, path, len: path.getLength(), kind});
  };
  [['u4','u2'],['u2','u1'],['u1','u3'],['u3','u5'],['u5','u6'],['u6','u4']].forEach(([a,b])=> connect(byId[a], byId[b], 'ring'));
  /* 環狀路線：沿著各地塊之間的短路，繞行一整圈（外圈）；主島上另有一圈繞著小學堂的內圈 */
  { const seq = ['u4','u2','u1','u3','u5','u6'], pts = [];
    seq.forEach((from,i)=>{ const to = seq[(i+1)%seq.length];
      const r = bridgePaths.find(r=> (r.a===from && r.b===to) || (r.a===to && r.b===from));
      if(r.a===from){ pts.push(r.wa, r.wb); } else { pts.push(r.wb, r.wa); } });
    const path = new THREE.CurvePath();
    for(let j=0;j<pts.length;j++) path.add(new THREE.LineCurve3(pts[j], pts[(j+1)%pts.length]));
    traffic.outer = {path, len: path.getLength()};
    /* 每一段的中點（占整圈的比例）：奇數段是穿過地塊的路，偶數段是地塊之間的短路 */
    const segL = pts.map((q,j)=>q.distanceTo(pts[(j+1)%pts.length])), tot = segL.reduce((a,b)=>a+b,0); let cum = 0;
    const mids = segL.map(l=>{ const m = (cum+l/2)/tot; cum += l; return m; });
    traffic.outer.chord = mids.filter((_,j)=>j%2===1); traffic.outer.road = mids.filter((_,j)=>j%2===0);
    const hubPts = []; for(let k=0;k<20;k++){ const a = k/20*Math.PI*2; hubPts.push(new THREE.Vector3(HUB.pos[0]+Math.cos(a)*4.1, y+0.09, HUB.pos[1]+Math.sin(a)*4.1)); /* 2026-11-28：5.6 比主地塊還大（內切半徑約 4.8），改 4.1 讓人走在地塊上 */ }
    const hp = new THREE.CatmullRomCurve3(hubPts, true); traffic.hub = {path:hp, len: hp.getLength()}; }
  const mk = (geo, hex, list)=>{ const im = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({color:hex, flatShading:true, roughness:0.9}), list.length);

  B(0.16,0.045,0.6,deckM,0,0.11,0); B(0.17,0.02,0.6,acc,0,0.085,0);                 /* 踏板 */
  const st = B(0.04,0.6,0.04,stemM,0,0.4,0.3); st.rotation.x = -0.12;           /* 立桿（微微往後斜） */
  B(0.42,0.035,0.035,deckM,0,0.7,0.27);                                           /* 把手 */
  for(const sx of [-1,1]) B(0.07,0.05,0.05,mat(0x111111),sx*0.2,0.7,0.27);
  B(0.06,0.04,0.04,mat(0xFFF3B0),0,0.56,0.34);                                     /* 車燈 */
  const fender = B(0.08,0.02,0.2,deckM,0,0.2,-0.33); fender.rotation.x = 0.25;
  const wheels = [];
  for(const z of [-0.33,0.33]){ const w = new THREE.Group(); w.position.set(0,0.09,z); c.add(w); add(w, new THREE.CylinderGeometry(0.085,0.085,0.06,12).rotateZ(Math.PI/2), whl); add(w, new THREE.BoxGeometry(0.065,0.1,0.02), stemM); wheels.push(w); }
  const body = new THREE.Group(); c.add(body);
  /* 兩點之間放一段圓柱狀的肢體（手、腳），比方塊自然 */
  const limb = (par,a,b,r,m)=>{ const d = new THREE.Vector3().subVectors(b,a), L = d.length(); const o = new THREE.Mesh(new THREE.CapsuleGeometry(r,Math.max(0.01,L-2*r),4,8), m);
    o.position.copy(a).add(b).multiplyScalar(0.5); o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize()); par.add(o); return o; };
  const V = (x,y,z)=>new THREE.Vector3(x,y,z), legs = [];
  /* 雙腳：一前一後站在踏板上，膝蓋微彎；髖部用圓的，不用方塊 */
  for(const [sx,z] of [[0.05,0.06],[-0.05,-0.08]]){ const l = new THREE.Group(); l.position.set(sx,0.5,z); body.add(l);
    limb(l, V(0,0.02,0), V(0,-0.36,0.015), 0.048, jeans);
    add(l, new THREE.BoxGeometry(0.075,0.045,0.14), mat(0xFFFFFF), 0,-0.375,0.03); legs.push(l); }
  { const hip = new THREE.Mesh(new THREE.SphereGeometry(0.1,12,8), jeans); hip.scale.set(1,0.7,0.8); hip.position.set(0,0.52,0); body.add(hip); }
  limb(body, V(0,0.5,0), V(0,0.83,0.02), 0.09, shirt);
  limb(body, V(0,0.82,0.03), V(0,0.88,0.04), 0.035, skin);   /* 脖子 */                       /* 身體 */
  add(body, new THREE.SphereGeometry(0.085,12,10), skin, 0,0.94,0.05);
  add(body, new THREE.SphereGeometry(0.09,12,6,0,Math.PI*2,0,Math.PI*0.55), mat([0x3A2A22,0x1E1B1B,0x8A5A3A][Math.floor(rnd()*3)]), 0,0.955,0.045);
  for(const sx of [-1,1]){ const sh = V(sx*0.11,0.78,0.03), el = V(sx*0.15,0.66,0.12), hd = V(sx*0.18,0.7,0.27);   /* 肩 → 手肘 → 握把手 */
    limb(body, sh, el, 0.032, shirt); limb(body, el, hd, 0.028, skin); }

}

function placeCar(c){
  const t = c.loop ? ((c.t%1)+1)%1 : Math.min(1, Math.max(0, c.t));
  const p = c.bp.path.getPointAt(t), tan = c.bp.path.getTangentAt(t).multiplyScalar(c.dir);
  if(c.lane){ p.x += -tan.z*c.lane; p.z += tan.x*c.lane; }
  c.car.position.copy(p); c.car.rotation.y = Math.atan2(tan.x, tan.z);
  if(c.loop && c.bp.len){ const dist = t*c.bp.len, u = c.car.userData; u.wheels.forEach(w=>{ w.rotation.x = dist/(u.skate?0.085:0.16); });
    if(u.skate){ u.body.position.y = 0.012*Math.sin(dist*3); }   /* 電動滑板車：不用踩，只隨路面微微起伏 */
    else { u.legs[0].rotation.x = Math.sin(dist*4)*0.55; u.legs[1].rotation.x = -Math.sin(dist*4)*0.55; } }
}

function isDark(){
  const t = document.documentElement.getAttribute('data-theme');
  if(t==='dark') return true; if(t==='light') return false;
  return matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyTheme(){
  const p = isDark()? PAL.dark : PAL.light;

  eagleBird.g.position.copy(p0); eagleBird.g.lookAt(p0.clone().add(f0)); eagleBird.g.visible = true;
  flyTo(p0.clone().add(new THREE.Vector3(f0.z*3.6+f0.x*3.0, 1.0, -f0.x*3.6+f0.z*3.0)), p0.clone());
  $dogCam.textContent = '鷂婆視角'; $dogCam.hidden = false; $('#hint').hidden = true; $dogFade.style.opacity = 0;
  dogSay('鷂婆要起飛囉！跟著牠從天上看關西');
}
function eagleStop(){
  if(!eagle) return; const E = eagle; eagle = null;
  eagleBird.g.visible = false; camera.fov = E.saved.fov; camera.updateProjectionMatrix();
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir); controls.target.copy(camera.position).addScaledVector(dir, 12.5);
  pendingLimits = E.saved; $dogCam.hidden = true; $dogCam.textContent = '狗狗視角'; $dogFade.style.opacity = 0; dogSay('');
}
const eTmp = new THREE.Vector3(), eTmp2 = new THREE.Vector3(), eUp = new THREE.Vector3(0,1,0);
function updateEagle(dt){
  if(!eagle) return; const E = eagle; { const now = performance.now()/1000; dt = Math.min(0.25, now-(E.last ?? now)); E.last = now; }   /* 用真實時間算，畫面卡頓也剛好 13 秒 */
  E.t += dt;
  const W = eagleBird.wings, flap = (a,sp)=>{ const k = Math.sin(E.t*sp)*a; W[0].rotation.z = k; W[1].rotation.z = -k; };
  if(E.phase==='intro'){ flap(0.55,9); if(!E.cried && E.t>0.8){ E.cried = true; SFX.eagle(); } if(E.t>=2.0){ E.phase = 'fly'; E.t = 0; tween = null; camera.fov = 60; camera.updateProjectionMatrix(); dogSay(''); } return; }
  if(E.phase==='end'){ if(E.t>=0.5){ eagleStop(); setMode('panorama'); setTab('units'); onSelect3D(null); } return; }
  E.u += dt/10.5;   /* 教師 2026-11-28：全程 13 秒＝起飛 2 秒＋飛一圈 10.5 秒＋收尾 0.5 秒 */
  if(E.u>=1){ E.phase = 'end'; E.t = 0; $dogFade.style.opacity = 1; return; }
  const C = E.P.curve, p = C.getPointAt(E.u), f = C.getTangentAt(E.u), f2 = C.getTangentAt((E.u+0.02)%1);
  const turn = f.x*f2.z - f.z*f2.x;   /* 轉彎方向與大小 → 身體側傾 */
  eagleBird.g.position.copy(p); eagleBird.g.lookAt(eTmp.copy(p).add(f)); eagleBird.g.rotateZ(Math.max(-0.35, Math.min(0.35, -turn*10)));
  E.flapT -= dt; if(E.flapT<-1.2) E.flapT = 9+Math.random()*4;   /* 大多在滑翔，偶爾拍幾下 */
  if(E.flapT<0) flap(0.4,6); else { W[0].rotation.z += (0.12-W[0].rotation.z)*Math.min(1,dt*4); W[1].rotation.z = -W[0].rotation.z; }
  const fh = eTmp2.set(f.x,0,f.z).normalize();
  const want = eTmp.copy(p).addScaledVector(fh,-9).addScaledVector(eUp,5), k = 1-Math.exp(-3*dt);
  camera.position.lerp(want, k);
  controls.target.lerp(eTmp.set(p.x+fh.x*16, 0, p.z+fh.z*16), k);   /* 2026-11-28：看鷂婆前下方的地面，畫面跟著飛過每個地方，不再盯著島中央 */
  /* 飛過景點：底下字幕說現在在哪裡的上空 */
  for(const q of E.P.list){ if(!E.said.has(q.n) && Math.hypot(q.x-p.x, q.z-p.z)<4.5){ E.said.add(q.n); dogSay(`飛過「${q.n}」上空`); E.sayT = 3.2; } }
  if(E.sayT>0){ E.sayT -= dt; if(E.sayT<=0) dogSay(''); }
}

function spotGo(i, k0){
  const sp = SPOTS[i], keep = spotView ? spotView.saved : null; if(sp && sp.n==='太和宮') SFX.bell();
  spotBusy = true; setMode('panorama'); spotBusy = false;

  spotView = {i, saved}; pendingLimits = null;
  controls.minDistance = 2.5; controls.maxDistance = 70; controls.maxPolarAngle = Math.PI/2-0.03; controls.minPolarAngle = 0.2;
  stage.classList.add('spotview'); SPOTS.forEach((o,j)=>o.el.classList.toggle('on', j===i));
  const c = $('#tourCap'); c.dataset.spot = '1'; c.hidden = false;
  const st = sp.stalls || null; let k = k0 || 0; /* k=0：全景（市集的總覽）；k≥1：第 k 個攤位 */

    const v = (st && k>0) ? st[k-1] : sp;
    c.innerHTML = `<span class="captxt">${v.html || escH(v.say)}</span><button type="button" class="spotback capshow" aria-label="打開說明"><span class="ic" aria-hidden="true">i</span>說明</button>`;
    /* 一開始只顯示「ⓘ 說明」小鈕，不擋畫面；按一下打開文字，再按一下收起 */
    c.classList.add('mini');

    if(st){ /* 左右箭頭：貼在目前這攤的左右兩側（畫面左＝南、右＝北）；總覽時不顯示 */
      const nb = [k>0 && k<st.length ? st[k] : null, k>1 ? st[k-2] : null];
      mnav.forEach((o,n)=>{ const t = nb[n]; o.el.hidden = !t; if(!t) return;

        o.el.innerHTML = n===0 ? `<span class="arr">‹</span><b>${t.n}</b>` : `<b>${t.n}</b><span class="arr">›</span>`;
        o.g.position.set(-27.7, 2.1, v.tg.z + (n===0 ? 1.95 : -1.95)); });

    flyTo(v.cam.clone(), v.tg.clone());
  };
  const go = d=>{ if(!st || k===0) return; const k2 = k + d; if(k2>=1 && k2<=st.length){ k = k2; render(); } };
  spotNav = st ? go : null;

const clock = new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if(tween){
    tween.k = Math.min(1, tween.k + dt/0.9);
    const k = 1 - Math.pow(1-tween.k, 3);
    camera.position.lerpVectors(tween.p0, tween.p1, k);
    controls.target.lerpVectors(tween.t0, tween.t1, k);
    if(tween.k>=1) tween = null;
  }
  if(!reduce){
        for(const s of spinners) s.rotation.y += dt*0.9;
    cloudGroup.rotation.y += dt*0.006;
    { const wp = cloudGroup.userData.wp || (cloudGroup.userData.wp = new THREE.Vector3()); cloudGroup.children.forEach(c=>{ c.getWorldPosition(wp); c.visible = wp.y > camera.position.y - 6 || wp.distanceTo(camera.position) > 95; }); }   /* 2026-11-28：鏡頭從高處看全景時，離鏡頭太近的雲先藏起來，免得一大團白擋住畫面 */
    updateCritters(dt, t);
    updateDams(t);
    for(const f of pondTick) f(dt,t);
    updateRipples(dt);
    for(const c of cars){ if(c.loop){ c.t = (c.t + dt*c.speed*c.dir + 1) % 1; } else { c.t += dt*c.speed*c.dir; if(c.t>1){ c.t=1; c.dir=-1; } if(c.t<0){ c.t=0; c.dir=1; } } placeCar(c); }
    updateLinkArrows(t);
    for(const w of walkers){ if(w.grab){ updateGrab(w,dt,t); continue; } if(w.loop){ w.t = (w.t + dt*w.speed*w.dir + 1) % 1; } else { w.t += dt*w.speed*w.dir; if(w.t>1){ w.t=1; w.dir=-1; } if(w.t<0){ w.t=0; w.dir=1; } } placeWalker(w, t); }
  } else {
    for(const c of cars) placeCar(c);
    updateLinkArrows(0);
    updateDams(0);
    for(const w of walkers) if(!w.grab) placeWalker(w, 0);
  }
  updateTour(dt);
  updateDogTour(dt);
  updateEagle(dt);
  controls.update();
  renderer.render(scene, camera);
  labelR.render(scene, camera);
});
}
